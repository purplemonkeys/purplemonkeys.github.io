ould.”</b> Only <span class='bd-fr-i'>peut</span> conjugates; <span class='bd-fr-i'>exploser</span> stays plain."}}],[{"fr":"Le régime iranien {{ne va probablement pas tomber|probably won't fall}} à cause de ces sanctions.","bd":{"meaning":"The Iranian regime probably won't fall because of these sanctions.","chunks":[["Le régime iranien","the Iranian regime"],["ne va probablement pas tomber","probably won't fall"],["à cause de ces sanctions","because of these sanctions"]],"key":"<b>Negative future:</b> <span class='bd-fr-i'>ne … pas</span> wraps around <span class='bd-fr-i'>va</span>, and the plain verb <span class='bd-fr-i'>tomber</span> stays after it."}},{"fr":"Les gens ordinaires {{souffrent|suffer}} plus que les dirigeants.","bd":{"meaning":"Ordinary people suffer more than the leaders.","chunks":[["Les gens ordinaires","ordinary people"],["souffrent","suffer"],["plus que","more than"],["les dirigeants","the leaders"]],"key":"<b>plus que = “more than.”</b> The everyday French comparative."}},{"fr":"Les prix du pétrole sont {{élevés|high}}, mais moins qu'avant.","bd":{"meaning":"Oil prices are high, but less than before.","chunks":[["Les prix du pétrole","oil prices"],["sont élevés","are high"],["mais moins qu'avant","but less than before"]],"key":"<b>moins que = “less than”</b> — the mirror image of <span class='bd-fr-i'>plus que</span>."}}],[{"fr":"Peut-être, le vrai but de Trump {{n'est pas de détruire|isn't to destroy}} l'Iran.","bd":{"meaning":"Maybe Trump's real goal isn't to destroy Iran.","chunks":[["Peut-être","maybe"],["le vrai but de Trump","Trump's real goal"],["n'est pas de détruire l'Iran","isn't to destroy Iran"]],"key":"<b>n'est pas de + verb = “isn't to ___.”</b> The <span class='bd-fr-i'>ne … pas</span> sandwich again, this time around <span class='bd-fr-i'>est</span>."}},{"fr":"{{Il veut|he wants}} sortir cette guerre des journaux avant les élections de novembre.","bd":{"meaning":"He wants to get this war out of the news before the November el /b> in French: <span class='fr'>les suivent</span> = “follow them,” not “follow-them.”"},{"fr":"Les taxes poussent les entreprises à partir","en":"<b>Verb + à/de + verb</b> is how French chains two actions together: <span class='fr'>pousser à</span>, <span class='fr'>menacer de</span>, <span class='fr'>continuer de</span> all follow this shape."},{"fr":"Le monde continue d'acheter","en":"<b>continuer de + plain verb = “keep doing.”</b> Your fourth helper-plus-plain-verb pattern, alongside <span class='fr'>pouvoir</span>, <span class='fr'>devoir</span> and <span class='fr'>vouloir</span>."}],"quiz":{"q":"Pourquoi les entreprises chinoises construisent-elles des usines à l'étranger ?","a":"Parce que la demande est faible en Chine et les taxes américaines sont élevées. (Because demand is weak in China and American tariffs are high.)"},"flag":"I compressed many country examples from the article (Morocco, Thailand, Hungary, Vietnam) down to two (Egypt, Serbia) to keep the story concrete rather than a list. <span class='fr'>un spectacle courant</span> is my plain rendering of “a common sight” — a native speaker might more naturally say <b>on en voit partout</b> (“you see them everywhere”), which I avoided here because it needs the pronoun <span class='fr'>en</span>, not yet introduced at this level."},{"id":"transshipment-scam","chip":"La fausse « arnaque » du contournement","kicker":"États-Unis · Chine · Commerce","title":"16. Les États-Unis accusent le monde entier de tricher avec la Chine","level":"A1","gist":"The White House published a paper called \"The Great Transshipment Scam,\" accusing more than 40 countries of helping China dodge US tariffs by rerouting goods through them. But rerouting supply chains to avoid high tariffs is a predictable, mostly legal reaction to the tariffs themselves — not proof of a scam. The paper's definition is so broad that almost any product with a Chinese part counts as suspicious, which critics say amounts to declaring war on global use","the report accuses"],["plus de 40 pays","more than 40 countries"],["d'aider la Chine","of helping China"],["à tricher","to cheat"]],"key":"<b>accuser qqn de + verb = “accuse someone of.”</b> Another verb-plus-little-word-plus-verb chain."}}],[{"fr":"Mais changer un {{lieu de fabrication|place of manufacture}} {{n'est pas|is not}} tricher.","bd":{"meaning":"But changing a place of manufacture is not cheating.","chunks":[["Mais changer un lieu de fabrication","but changing a place of manufacture"],["n'est pas","is not"],["tricher","cheating"]],"key":"<b>ne … pas sandwich</b> around <span class='bd-fr-i'>est</span>, this time wrapping a whole “X is not Y” sentence."}},{"fr":"{{C'est|it's}} une réaction normale à des taxes douanières très hautes.","bd":{"meaning":"It's a normal reaction to very high tariffs.","chunks":[["C'est","it's"],["une réaction normale","a normal reaction"],["à des taxes douanières très hautes","to very high tariffs"]],"key":"<b>c'est</b> — the everyday way to link an idea to what it is."}},{"fr":"Le rapport {{ne fait pas de différence|doesn't distinguish}} entre tricher et {{simplement changer d'usine|simply changing factories}}.","bd":{"meaning":"The report doesn't distinguish between cheating and simply changing factories.","chunks":[["Le rapport ne fait pas de différence","the report doesn't make a distinction"],["entre tricher","between cheating"],["et simplement changer d'usine","and simply changing factories"]],"key":"<b>faire une différence</b> is a fixed phrase for “to distinguish” — here negated with the usual <span class='bd-fr-i'>ne … pas</span> sandwich."}}],[{"fr":"{{Selon|according to}} le rapport, presque tout {{qui touche|that touches}} la Chine est {{suspect|suspicious}}.","bd":{"meaning":"According to the report, almost everything that touches China is suspicious.","chunks":[["Selon le rapport","according to the report"],["presque tout","almost everything"],["qui touche la Chine","that touches China"],["est suspect","is su     if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
    if (!SHOW_WORD_HIGHLIGHTS) {
      container.appendChild(document.createTextNode(m[1]));
      last = re.lastIndex;
      return 1; // continue
    }
    var wrap = document.createElement('span');
    wrap.className = 'term-wrap';
    var term = document.createElement('span');
    term.className = 'term';
    term.setAttribute('role', 'button');
    term.setAttribute('tabindex', '0');
    term.setAttribute('aria-label', m[1] + ' — ' + m[2]);
    term.textContent = m[1];
    var gloss = document.createElement('span');
    gloss.className = 'gloss';
    gloss.textContent = m[2];
    var toggle = function toggle(e) {
      if (e) e.stopPropagation();
      if (wrap.classList.contains('is-open')) {
        wrap.classList.remove('is-open');
      } else {
        wrap.classList.add('is-open');
      }
      term.setAttribute('aria-expanded', wrap.classList.contains('is-open'));
    };
    addTap(term, toggle);
    term.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        e.stopPropagation();
        toggle();
      }
    });
    wrap.appendChild(term);
    wrap.appendChild(gloss);
    container.appendChild(wrap);
    last = re.lastIndex;
  };
  while ((m = re.exec(text)) !== null) {
    if (_loop()) continue;
  }
  if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
}
function buildBreakdown(bd) {
  var box = document.createElement('div');
  box.className = 'breakdown';
  var html = '<div class="bd-meaning">' + bd.meaning + '</div>';
  if (bd.chunks && bd.chunks.length) {
    html += '<div class="bd-chunks">';
    bd.chunks.forEach(function (c) {
      html += '<div class="bd-row"><span class="bd-fr">' + c[0] + '</span><span class="bd-en">' + c[1] + '</span></div>';
    });
    html += '</div>';
  }
  if (bd.key) html += '<div class="bd-key"><span class="bd-key-label">Comment ça marche</span>' + bd.key + '</div>';
  box.innerHTML = html;
  return box;
}
function renderBody(paragraphs) {
  var frag = document.createDocumentFragment();
  paragraphs.forEach(function (par) {
    var p = document.createElement('div');
    p.className = 'para';
    par.forEach(function (sent) {
      var s = document.createElement('span');
      s.className = 'sentence';
      s.setAttribute('role', 'button');
      s.setAttribute('tabindex', '0');
      s.setAttribute('aria-expanded', 'false');
      renderInline(sent.fr, s);
      var box = buildBreakdown(sent.bd);
      var toggle = function toggle() {
        var open = !box.classList.contains('open');
        if (open) {
          box.classList.add('open');
          s.classList.add('active');
        } else {
          box.classList.remove('open');
          s.classList.remove('active');
        }
        s.setAttribute('aria-expanded', open);
      };
      addTap(s, toggle);
      s.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle();
        }
      });
      p.appendChild(s);
      p.appendChild(document.createTextNode(' '));
      p.appendChild(box);
    });
    frag.appendChild(p);
  });
  return frag;
}
function buildArticle(s) {
  article.innerHTML = '';
  var kicker = document.createElement('div');
  kicker.className = 'kicker';
  kicker.textContent = s.kicker || '';
  article.appendChild(kicker);
  var trow = document.createElement('div');
  trow.className = 'title-row';
  var h1 = document.createElement('h1');
  h1.className = 'title';
  h1.textContent = s.title;
  var lvl = document.createElement('span');
  lvl.className = 'story-lvl';
  lvl.textContent = s.level || 'A1';
  trow.appendChild(h1);
  trow.appendChild(lvl);
  article.appendChild(trow);
  var gist = document.createElement('div');
  gist.className = 'gist' + (gistShown ? '' : ' hidden');
  gist.id = 'gistBox';
  gist.innerHTML = "<span class='gist-label'>The gist, in English</span>" + s.gist;
  article.appendChild(gist);
  var body = document.createElement('div');
  body.className = 'body';
  body.id = 'bodyBox';
  body.appendChild(renderBody(s.body));
  article.appendChild(body);
  var gsec = document.createElement('div');
  gsec.className = 'section';
  var gdet = document.createElement('details');
  gdet.open = true;
  gdet.innerHTML = "<summary><span class='chev'>▶</span>Notes de grammaire</summary>";
  (s.grammar || []).forEach(function (n) {
    var note = document.createElement('div');
    note.className = 'note';
    note.innerHTML = "<h4>" + n.fr + "</h4><p>" + n.en + "</p>";
    gdet.appendChild(note);
  });
  gsec.appendChild(gdet);
  article.appendChild(gsec);
  if (s.quiz) {
    var qsec = document.createElement('div');
    qsec.className = 'section';
    var qdet = document.createElement('details');
    qdet.innerHTML = "<summary><span class='chev'>▶</span>Petite question</summary>";
    var quiz = document.createElement('div');
    quiz.className = 'quiz';
    quiz.innerHTML = "<p class='q'>" + s.quiz.q + "</p><button class='reveal-btn'>Voir la réponse</button><p class='answer'>" + s.quiz.a + "</p>";
    var btn = quiz.querySelector('.reveal-btn'),
      ans = quiz.querySelector('.answer');
    addTap(btn, function () {
      ans.classList.add('show');
      btn.style.display = 'none';
    });
    qdet.appendChild(quiz);
    qsec.appendChild(qdet);
    article.appendChild(qsec);
  }
  if (s.flag) {
    var flag = document.createElement('div');
    flag.className = 'flag';
    flag.innerHTML = "<b>À noter</b> · " + s.flag;
    article.appendChild(flag);
  }
}

/* ---------- index cards ---------- */
function makeCard(s) {
  var read = isRead(s.id);
  var card = document.createElement('div');
  card.className = 'card' + (read ? ' read' : '');
  var open = document.createElement('button');
  open.className = 'card-open';
  var k = document.createElement('span');
  k.className = 'k';
  k.textContent = s.kicker || '';
  var t = document.createElement('span');
  t.className = 'ttl';
  t.textContent = s.title;
  var meta = document.createElement('span');
  meta.className = 'meta';
  var lvl = document.createElement('span');
  lvl.className = 'lvl';
  lvl.textContent = s.level || 'A1';
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = s.chip || '';
  meta.appendChild(lvl);
  meta.appendChild(tag);
  var go = document.createElement('span');
  go.className = 'go';
  go.textContent = read ? 'Relire →' : 'Lire →';
  open.appendChild(k);
  open.appendChild(t);
  open.appendChild(meta);
  open.appendChild(go);
  addTap(open, function () {
    location.hash = '#/' + encodeURIComponent(s.id);
    showStory(s.id);
  });
  var mark = document.createElement('button');
  mark.className = 'card-mark';
  mark.textContent = '✓';
  mark.setAttribute('aria-label', read ? 'Marquer comme non lu' : 'Marquer comme lu');
  mark.title = mark.getAttribute('aria-label');
  addTap(mark, function (e) {
    e.stopPropagation();
    setRead(s.id, !isRead(s.id));
    renderCards();
  });
  card.appendChild(open);
  card.appendChild(mark);
  return card;
}
function renderCards() {
  var unread = STORIES.filter(function (s) {
    return !isRead(s.id);
  });
  var read = STORIES.filter(function (s) {
    return isRead(s.id);
  });
  cardsEl.innerHTML = '';
  if (unread.length === 0) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = 'Tout est lu 🎉';
    cardsEl.appendChild(e);
  } else unread.forEach(function (s) {
    return cardsEl.appendChild(makeCard(s));
  });
  readCardsEl.innerHTML = '';
  read.forEach(function (s) {
    return readCardsEl.appendChild(makeCard(s));
  });
  readCount.textContent = read.length;
  readSection.style.display = read.length ? 'block' : 'none';
}

/* ---------- routing (hash = source of truth) ---------- */
function syncReadBtn() {
  var r = currentId && isRead(currentId);
  toggleReadBtn.setAttribute('aria-pressed', r ? 'true' : 'false');
  toggleReadBtn.textContent = r ? 'Lu ✓' : 'Marquer comme lu';
}
function showIndex() {
  currentId = null;
  renderCards();
  viewStory.classList.remove('active');
  viewIndex.classList.add('active');
  window.scrollTo(0, 0);
}
function showStory(id) {
  var s = null;
  for (var i = 0; i < STORIES.length; i++) {
    if (STORIES[i].id === id) {
      s = STORIES[i];
      break;
    }
  }
  if (!s) {
    showIndex();
    return;
  }
  currentId = id;
  gistShown = true;
  toggleGistBtn.setAttribute('aria-pressed', 'true');
  buildArticle(s);
  syncReadBtn();
  viewIndex.classList.remove('active');
  viewStory.classList.add('active');
  window.scrollTo(0, 0);
}
function route() {
  var m = location.hash.match(/^#\/(.+)$/);
  if (m) showStory(decodeURIComponent(m[1]));else showIndex();
}
window.addEventListener('hashchange', route);
addTap(backBtn, function () {
  location.hash = '#/';
  showIndex();
});
addTap(brand, function () {
  location.hash = '#/';
  showIndex();
});
brand.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    location.hash = '#/';
  }
});
addTap(toggleGistBtn, function () {
  gistShown = !gistShown;
  toggleGistBtn.setAttribute('aria-pressed', gistShown);
  var b = document.getElementById('gistBox');
  if (b) {
    if (gistShown) {
      b.classList.remove('hidden');
    } else {
      b.classList.add('hidden');
    }
  }
});
addTap(toggleReadBtn, function () {
  if (!currentId) return;
  setRead(currentId, !isRead(currentId));
  syncReadBtn();
});
function renderMem() {
  var opts = memToggle.getElementsByClassName('mem-opt');
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed', opts[i].getAttribute('data-mem') === mem ? 'true' : 'false');
  }
  if (mem === 'M1') {
    memHint.textContent = m1Failed ? 'M1 — mémoire partagée (en ligne seulement, pas en fichier local).' : 'M1 — mémoire partagée du dépôt, en lecture seule.';
  } else {
    memHint.textContent = 'M2 — mémoire de cet appareil.';
  }
}
function setMem(v) {
  if (v !== 'M1' && v !== 'M2') return;
  mem = v;
  saveMem();
  renderMem();
  if (mem === 'M1' && !m1Loaded && !m1Failed) {
    loadM1(function () {
      renderMem();
      renderCards();
      if (currentId) syncReadBtn();
    });
  } else {
    renderCards();
    if (currentId) syncReadBtn();
  }
}
(function wireMem() {
  var opts = memToggle.getElementsByClassName('mem-opt');
  for (var i = 0; i < opts.length; i++) {
    (function (btn) {
      addTap(btn, function () {
        setMem(btn.getAttribute('data-mem'));
      });
    })(opts[i]);
  }
})();

renderMem();
if (mem === 'M1') {
  loadM1(function () {
    renderMem();
    renderCards();
    route();
  });
} else {
  renderCards();
  route();
}

</script>
