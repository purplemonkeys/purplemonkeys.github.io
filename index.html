nks":[["ASML est une entreprise","ASML is a company"],["des Pays-Bas","from the Netherlands (les Pays-Bas = the Netherlands)"]],"key":"<b>des = de + les.</b> <span class='bd-fr-i'>des Pays-Bas</span> = 'of / from the Netherlands' — the country's name itself is plural (<span class='bd-fr-i'>les Pays-Bas</span>)."}}],[{"fr":"Depuis 2019, les États-Unis {{interdisent|forbid}} de vendre cette machine à la Chine.","bd":{"meaning":"Since 2019, the United States has forbidden selling this machine to China.","chunks":[["Depuis 2019","since 2019 (depuis = since)"],["les États-Unis interdisent","the United States forbid (interdire = to forbid)"],["de vendre cette machine à la Chine","to sell this machine to China (interdire de + plain verb)"]],"key":"<b>depuis = 'since / for'.</b> French uses the present with <span class='bd-fr-i'>depuis</span> where English says 'has': <span class='bd-fr-i'>depuis 2019, ils interdisent</span> = 'since 2019 they have forbidden'."}},{"fr":"Mais aujourd'hui, un {{ministre|minister}} américain dit : peut-être qu'une machine est {{allée|went (from aller)}} en Chine.","bd":{"meaning":"But today, a U.S. minister says: maybe a machine went to China.","chunks":[["Mais aujourd'hui","but today"],["un ministre américain dit","a U.S. minister says (américain comes after the noun)"],["peut-être qu'une machine est allée","maybe a machine went (peut-être = maybe)"],["en Chine","to China"]],"key":"<b>Past with être, not avoir.</b> <span class='bd-fr-i'>est allée</span> = 'went': a few verbs (like <span class='bd-fr-i'>aller</span>) use <span class='bd-fr-i'>être</span> in the past, and then the verb agrees — <span class='bd-fr-i'>allée</span> has an extra -e for <span class='bd-fr-i'>machine</span> (feminine)."}}],[{"fr":"ASML {{répond|answers}} : « C'est impossible. »","bd":{"meaning":"ASML answers: “It's impossible.”","chunks":[["ASML répond","ASML answers / replies (répondre = to answer)"],["c'est impossible","it's impossible"]],"key":"<b>c'est = 'it is / that's'.</b> <span class='bd-fr-i'>c'est impossible</span> = 'it's impossible' — the everyday set phrase."}},{"fr":"L'entreprise dit : nous {{savons|know}} où sont toutes nos machines.","bd":{"meaning":"The company says: we know where all our machines are.","chunks":[["L'entreprise dit","the company says"],["nous savons","we know (savoir = to know a fact)"],["où sont toutes nos machines","where all our machines are (toutes agrees: feminine plural)"]],"key":"<b>savoir = 'to know' (a fact).</b> <span class='bd-fr-i'>nous savons</span> = 'we know'. French says <span class='bd-fr-i'>où sont</span> ('where are') with no extra word."}},{"fr":"{{Aucune|No}} machine n'est en Chine.","bd":{"meaning":"No machine is in China.","chunks":[["Aucune machine","no machine / not one machine (aucun / aucune = none)"],["n'est en Chine","is not in China — aucune… ne is a negative pair"]],"key":"<b>aucune … ne = 'no / not any'.</b> Like <span class='bd-fr-i'>ne…pas</span>, it comes in two parts: <span class='bd-fr-i'>aucune machine n'est</span> = 'no machine is'."}}],[{"fr":"Le gouvernement des Pays-Bas est {{d'accord|in agreement}}.","bd":{"meaning":"The Dutch government agrees.","chunks":[["Le gouvernement des Pays-Bas","the Dutch government (literally 'of the Netherlands')"],["est d'accord","agrees (être d'accord = to agree)"]],"key":"<b>être d'accord = 'to agree'.</b> French says 'is in agreement': <span class='bd-fr-i'>est d'accord</span>."}},{"fr":"Il dit : nous {{respectons|follow / respect}} les {{règles|rules}}.","bd":{"meaning":"It says: we follow the rules.","chunks":[["Il dit","it says (il = 'it', for le gouvernement)"],["nous respectons les règles","we follow / respect the rules (respecter = to respect / obey)"]],"key":"<b>-ons = the 'we' ending.</b> <span class='bd-fr-i'>nous respectons</span>, <span class='bd-fr-i'>nous savons</span> — verbs for <span class='bd-fr-i'>nous</span> ('we') end in <span class='bd-fr-i'>-ons</span>."}}],[{"fr":"Mais {{derrière|behind}} ce problème, il y a un plus grand {{conflit|conflict}}.","bd":{"meaning":"But behind this problem, there is a bigger conflict.","chunks":[["Mais derrière ce problème","but behind this problem (derrière = behind)"],["il y a un plus grand conflit","there is a bigger conflict (plus grand = bigger)"]],"key":"<b>plus grand = 'bigger'.</b> <span class='bd-fr-i'>plus</span> + adjective makes the comparison: <span class='bd-fr-i'>plus grand</span> = 'bigger', like <span class='bd-fr-i'>plus cher</span> ('more expensive')."}},{"fr":"Les États-Unis et l'Europe ne sont pas toujours d'accord sur la Chine.","bd":{"meaning":"The United States and Europe don't always agree about China.","chunks":[["Les États-Unis et l'Europe","the United States and Europe"],["ne sont pas toujours d'accord","don't always agree — ne…pas wraps sont"],["sur la Chine","about / on China (sur = on)"]],"key":"<b>Negation sandwich: ne … pas.</b> It still wraps the verb with <span class='bd-fr-i'>toujours</span> tucked inside: <span class='bd-fr-i'>ne sont pas toujours</span> = 'are not always'."}}],[{"fr":"La Chine veut aussi fabriquer sa {{propre|own}} machine.","bd":{"meaning":"China also wants to make its own machine.","chunks":[["La Chine veut aussi fabriquer","China also wants to make (vouloir + plain verb)"],["sa propre machine","its own machine (propre before the noun = 'own')"]],"key":"<b>propre before the noun = 'own'.</b> <span class='bd-fr-i'>sa propre machine</span> = 'its own machine'. (After the noun, <span class='bd-fr-i'>propre</span> means 'clean' — position changes the meaning!)"}},{"fr":"Mais c'est très difficile : ça peut prendre {{des années|years}}.","bd":{"meaning":"But it's very difficult: it can take years.","chunks":[["Mais c'est très difficile","but it's very difficult"],["ça peut prendre des années","it can take years (ça = that / it; des années = years)"]],"key":"<b>ça peut + plain verb.</b> <span class='bd-fr-i'>ça peut prendre</span> = 'it can take' — <span class='bd-fr-i'>ça</span> ('that/it') + <span class='bd-fr-i'>peut</span> (can) + the plain verb <span class='bd-fr-i'>prendre</span>."}}],[{"fr":"Les États-Unis veulent une {{nouvelle loi|new law}} plus stricte.","bd":{"meaning":"The United States wants a new, stricter law.","chunks":[["Les États-Unis veulent","the United States want (vouloir = to want)"],["une nouvelle loi plus stricte","a new, stricter law (nouvelle before the noun; plus stricte = stricter)"]],"key":"<b>nouveau / nouvelle goes BEFORE the noun.</b> <span class='bd-fr-i'>une nouvelle loi</span> = 'a new law' — and it agrees: <span class='bd-fr-i'>nouvelle</span> for the feminine <span class='bd-fr-i'>loi</span>."}},{"fr":"Mais les Pays-Bas ne sont pas {{contents|happy}}.","bd":{"meaning":"But the Netherlands is not happy.","chunks":[["Mais les Pays-Bas","but the Netherlands"],["ne sont pas contents","are not happy — ne…pas wraps sont; contents takes -s (plural)"]],"key":"<b>Negation sandwich: ne … pas.</b> <span class='bd-fr-i'>ne sont pas contents</span> = 'are not happy'."}},{"fr":"C'est une {{petite bataille|small battle}} dans une grande {{guerre|war}} pour la technologie.","bd":{"meaning":"It's a small battle in a big war over technology.","chunks":[["C'est une petite bataille","it's a small battle (petite before the noun)"],["dans une grande guerre","in a big war (grande before the noun)"],["pour la technologie","for / over technology"]],"key":"<b>Size adjectives go BEFORE the noun.</b> <span class='bd-fr-i'>petite bataille</span>, <span class='bd-fr-i'>grande guerre</span> — <span class='bd-fr-i'>petit</span> and <span class='bd-fr-i'>grand</span> sit in front, and both agree (feminine)."}}]],"grammar":[{"fr":"une machine est allée en Chine","en":"<b>Some verbs form the past with être, not avoir.</b> <span class='fr'>aller</span> is one: <span class='fr'>est allée</span> = 'went'. With <span class='fr'>être</span> the past word agrees with the subject — <span class='fr'>allée</span> gains an extra -e for the feminine <span class='fr'>machine</span>. (Contrast <span class='fr'>a gagné</span>, which uses avoir and doesn't agree.)"},{"fr":"veut fabriquer / ça peut prendre / veulent une loi","en":"<b>helper + plain verb.</b> <span class='fr'>veut</span>, <span class='fr'>peut</span>, <span class='fr'>veulent</span> carry the subject; the next verb stays plain. Your pouvoir / vouloir / devoir family."},{"fr":"une seule entreprise / nouvelle loi / plus grand conflit / petite bataille","en":"<b>a small set of adjectives sit BEFORE the noun</b> (<span class='fr'>grand</span>, <span class='fr'>petit</span>, <span class='fr'>nouveau</span>, <span class='fr'>seul</span>, <span class='fr'>propre</span>…) and still agree: <span class='fr'>seule</span>, <span class='fr'>nouvelle</span>, <span class='fr'>petite</span>."}],"quiz":{"q":"Pourquoi cette machine est très importante ?","a":"Parce qu'elle fabrique les meilleures puces, et ces puces sont importantes pour l'IA. (Because it makes the best chips, and these chips are important for AI.)"},"flag":"Compressed very hard from a long geopolitical piece into a plain A1 through-line — a neutral retelling, not a view on the export-control politics. I dropped the historical opening (Peter the Great, A.Q. Khan), the DUV-vs-EUV and 'multi-patterning' detail, the named people (Lutnick, Sjoerdsma) and ASML's exact count of 340 machines, the Pax Silica alliance, the MATCH Act specifics, the Nvidia chips, and the Nexperia dispute. Word choices to flag: <span class='fr'>une puce</span> is the normal French word for a computer chip (it also means 'flea' — context makes it clear); <span class='fr'>interdire de vendre</span> ('forbid to sell') is my plain stand-in for formal <span class='fr'>contrôles à l'exportation</span> ('export controls'); and I used <span class='fr'>les Pays-Bas</span> ('the Netherlands') rather than the adjective <span class='fr'>néerlandais</span> to keep it transparent. The <span class='fr'>est allée</span> agreement is correct, but être-verbs + agreement is exactly the kind of thing worth double-checking as you advance."},{"id":"us-europe-economy","chip":"Qui va mieux ?","kicker":"Économie · Comparaison","title":"9. États-Unis ou Europe : qui va mieux ?","level":"A1","gist":"Most people assume Europe's economy is falling behind the US, especially in tech. But Americans live shorter, more violent lives, with far more people in prison — and once you account for real purchasing power, Europe isn't actually poorer, just weaker geopolitically. The argument (from an FT column summarising economist Paul Krugman) is that Europe's real vulnerability is security and defense, not economics.","body":[[{"fr":"Beaucoup de gens pensent que l'économie de l'Europe {{est en déclin|is declining}}.","bd":{"meaning":"Many people think Europe's economy is declining.","chunks":[["Beaucoup de gens","many people (beaucoup de = a lot of)"],["pensent que","think that — pensent from penser, the ils/elles form"],["l'économie de l'Europe","Europe's economy (de = 's / of)"],["est en déclin","is declining (en déclin = in decline)"]],"key":"<b>“penser que” + a full sentence.</b> Use <span class='bd-fr-i'>penser que</span> to report what people think — the clause after it works like any other sentence."}},{"fr":"Ils disent que les États-Unis sont {{plus forts|stronger}}, surtout en technologie.","bd":{"meaning":"They say the US is stronger, especially in technology.","chunks":[["Ils disent que","they say that"],["les États-Unis sont","the United States is/are (États-Unis takes a plural verb)"],["plus forts","stronger (plus + adjective)"],["surtout en technologie","especially in technology"]],"key":"<b>plus + adjective = “more ___ / -er.”</b> <span class='bd-fr-i'>plus forts</span> = “stronger” — the everyday way to build a comparative."}},{"fr":"Les États-Unis sont un seul pays, donc ils peuvent {{agir vite|act fast}}.","bd":{"meaning":"The US is a single country, so it can act fast.","chunks":[["Les États-Unis sont un seul pays","the US is a single/one country"],["donc","so / therefore"],["ils peuvent","it/they can (pouvoir)"],["agir vite","act fast — plain verb after peuvent"]],"key":"<b>pouvoir + plain verb.</b> <span class='bd-fr-i'>peuvent agir</span> = “can act” — only <span class='bd-fr-i'>peuvent</span> changes; <span class='bd-fr-i'>agir</span> stays plain."}}],[{"fr":"Mais la vie aux États-Unis n'est pas parfaite.","bd":{"meaning":"But life in the US is not perfect.","chunks":[["Mais","but"],["la vie aux États-Unis","life in the US (aux = à + les)"],["n'est pas parfaite","is not perfect — the ne…pas sandwich around est"]],"key":"<b>ne … pas around “est.”</b> <span class='bd-fr-i'>n'est pas</span> = “is not” — the same sandwich you'll meet again and again."}},{"fr":"Les Américains vivent {{environ 79 ans|about 79 years}} ; les Européens, environ 83 ans.","bd":{"meaning":"Americans live about 79 years; Europeans, about 83.","chunks":[["Les Américains vivent","Americans live"],["environ 79 ans","about 79 years (environ = about/around)"],["les Européens","Europeans (same verb reused, dropped after the semicolon)"],["environ 83 ans","about 83 years"]],"key":"<b>environ = “about / around.”</b> Handy for any approximate number — <span class='bd-fr-i'>environ 79 ans</span> = “about 79 years.”"}},{"fr":"Le {{taux de prisonniers|rate of people in prison}} est presque {{huit fois plus élevé|eight times higher}} aux États-Unis qu'en Allemagne.","bd":{"meaning":"The rate of people in prison is almost eight times higher in the US than in Germany.","chunks":[["Le taux de prisonniers","the rate of people in prison (taux = rate)"],["est presque huit fois plus élevé","is almost eight times higher (fois = times)"],["aux États-Unis","in the US"],["qu'en Allemagne","than in Germany"]],"key":"<b>“fois” for multiples.</b> <span class='bd-fr-i'>huit fois plus élevé</span> = “eight times higher” — combine a number with <span class='bd-fr-i'>fois</span> to say “X times more.”"}},{"fr":"Pourtant, les États-Unis {{dépensent|spend}} plus d'argent pour la santé.","bd":{"meaning":"Yet the US spends more money on health.","chunks":[["Pourtant","yet / however"],["les États-Unis dépensent","the US spends (dépenser, ils/elles form)"],["plus d'argent","more money"],["pour la santé","on health"]],"key":"<b>plus de/d' + noun = “more ___.”</b> Same pattern as before — <span class='bd-fr-i'>de</span> becomes <span class='bd-fr-i'>d'</span> before a vowel."}}],[{"fr":"Depuis 2000, {{le revenu par personne|income per person}} augmente plus vite aux États-Unis.","bd":{"meaning":"Since 2000, income per person has grown faster in the US.","chunks":[["Depuis 2000","since 2000"],["le revenu par personne","income per person"],["augmente plus vite","grows faster (augmenter = to grow/increase)"],["aux États-Unis","in the US"]],"key":"<b>depuis + present tense = “since ___, has been ___ing.”</b> French keeps the present where English switches tense: <span class='bd-fr-i'>depuis 2000, ça augmente</span> = “since 2000, it's been growing.”"}},{"fr":"Mais c'est étrange : le niveau de vie en Europe {{se rapproche|gets closer}} quand même de celui des États-Unis.","bd":{"meaning":"But here's the strange part: Europe's standard of living is getting closer to the US's anyway.","chunks":[["Mais c'est étrange","but it's strange / here's the odd part"],["le niveau de vie en Europe","the standard of living in Europe"],["se rapproche","gets closer (se rapprocher = to get closer)"],["quand même de celui des États-Unis","to that of the US anyway (celui = “the one” — stands in for “niveau de vie”)"]],"key":"<b>“celui” replaces a noun</b> to avoid repeating it: <span class='bd-fr-i'>celui des États-Unis</span> = “that of the US,” instead of saying “le niveau de vie des États-Unis” again."}},{"fr":"Les économistes appellent ça {{un paradoxe|a paradox}}.","bd":{"meaning":"Economists call this a paradox.","chunks":[["Les économistes appellent","economists call (appeler)"],["ça","that / this"],["un paradoxe","a paradox — something that seems impossible but is true"]],"key":"<b>appeler + ça + noun = “call this ___.”</b> Same shape as <span class='bd-fr-i'>on appelle ça…</span>, just with a different subject."}}],[{"fr":"La raison principale, c'est la technologie.","bd":{"meaning":"The main reason is technology.","chunks":[["La raison principale","the main reason"],["c'est","is / that's"],["la technologie","technology"]],"key":"<b>c'est to name the answer.</b> <span class='bd-fr-i'>c'est la technologie</span> = “it's technology” — a simple way to state a cause."}},{"fr":"Le secteur technologique est beaucoup plus grand aux États-Unis qu'en Europe.","bd":{"meaning":"The tech sector is much bigger in the US than in Europe.","chunks":[["Le secteur technologique","the tech sector"],["est beaucoup plus grand","is much bigger (beaucoup plus = much more)"],["aux États-Unis","in the US"],["qu'en Europe","than in Europe (que → qu' before a vowel)"]],"key":"<b>beaucoup plus + adjective = “much more / much ___-er.”</b> <span class='bd-fr-i'>beaucoup</span> strengthens the comparative you already know."}},{"fr":"Cette différence explique presque toute la différence de croissance entre les deux régions.","bd":{"meaning":"This one difference explains almost all of the growth gap between the two regions.","chunks":[["Cette différence explique","this difference explains"],["presque toute","almost all of (toute agrees with the feminine “différence”)"],["la différence de croissance","the growth gap/difference"],["entre les deux régions","between the two regions"]],"key":"<b>“toute” agrees with the noun it describes.</b> <span class='bd-fr-i'>toute la différence</span> is feminine singular, matching <span class='bd-fr-i'>différence</span>."}},{"fr":"En plus, il est difficile de {{mesurer|measure}} la vraie valeur de la technologie.","bd":{"meaning":"Also, it's hard to measure the real value of technology.","chunks":[["En plus","also / on top of that"],["il est difficile de","it's hard to (+ plain verb)"],["mesurer","to measure — plain verb after “difficile de”"],["la vraie valeur de la technologie","the real value of technology (vraie comes before the noun)"]],"key":"<b>il est difficile de + plain verb = “it's hard to ___.”</b> Like <span class='bd-fr-i'>pour + verb</span>, the verb after <span class='bd-fr-i'>de</span> stays plain."}}],[{"fr":"Si on compare {{le vrai pouvoir d'achat|real purchasing power}}, l'Europe n'est pas vraiment en retard.","bd":{"meaning":"If you compare real purchasing power, Europe isn't really behind.","chunks":[["Si on compare","if you/one compare(s) (on = the general “you/we/people”)"],["le vrai pouvoir d'achat","real purchasing power — what money can actually buy"],["l'Europe n'est pas vraiment","Europe isn't really (ne…pas sandwich)"],["en retard","behind / late"]],"key":"<b>“on” again for the general “you.”</b> <span class='bd-fr-i'>si on compare</span> = “if you compare” — no need for a specific subject."}},{"fr":"Les Européens peuvent acheter presque autant de choses que les Américains.","bd":{"meaning":"Europeans can buy almost as many things as Americans.","chunks":[["Les Européens peuvent acheter","Europeans can buy (pouvoir + plain verb)"],["presque autant de choses","almost as many things (autant de = as much/many)"],["que les Américains","as Americans"]],"key":"<b>autant de ___ que = “as much/many ___ as.”</b> A third comparison shape, alongside <span class='bd-fr-i'>plus … que</span> and <span class='bd-fr-i'>moins … que</span>."}}],[{"fr":"Il y a une raison à ce paradoxe : la technologie américaine aide le monde entier.","bd":{"meaning":"There's a reason for this paradox: American technology helps the whole world.","chunks":[["Il y a une raison","there is a reason"],["à ce paradoxe","for this paradox"],["la technologie américaine aide","American technology helps"],["le monde entier","the whole world"]],"key":"<b>il y a, once more.</b> Same fixed phrase as before, now introducing an explanation instead of a fact."}},{"fr":"Même les pays qui n'ont pas de grandes entreprises tech {{en profitent|benefit from it}}.","bd":{"meaning":"Even countries that don't have big tech companies benefit from it.","chunks":[["Même les pays","even the countries"],["qui n'ont pas de grandes entreprises tech","that don't have big tech companies (qui = that/which; ne…pas + de after the negation)"],["en profitent","benefit from it (en = “from it”)"]],"key":"<b>“qui” + ne…pas together.</b> <span class='bd-fr-i'>qui n'ont pas de</span> = “that don't have” — the relative clause and the negation sandwich stack up."}}],[{"fr":"Donc, la vie n'est pas {{pire|worse}} en Europe qu'aux États-Unis.","bd":{"meaning":"So, life isn't worse in Europe than in the US.","chunks":[["Donc","so / therefore"],["la vie n'est pas pire","life isn't worse (pire = worse)"],["en Europe qu'aux États-Unis","in Europe than in the US"]],"key":"<b>pire = the irregular “worse.”</b> It doesn't follow the plus/moins pattern — it's its own word, like English “worse” instead of “more bad.”"}},{"fr":"Mais l'Europe reste plus faible, parce qu'elle {{dépend de|depends on}} la technologie américaine.","bd":{"meaning":"But Europe remains weaker, because it depends on American technology.","chunks":[["Mais l'Europe reste","but Europe remains/stays (rester)"],["plus faible","weaker"],["parce qu'elle dépend de","because it depends on (que → qu' before a vowel)"],["la technologie américaine","American technology"]],"key":"<b>dépendre de = “to depend on.”</b> A fixed pairing — in French the verb always takes <span class='bd-fr-i'>de</span> before what you depend on."}},{"fr":"Le vrai problème de l'Europe, ce n'est pas l'économie : c'est la sécurité et la défense.","bd":{"meaning":"Europe's real problem isn't the economy: it's security and defense.","chunks":[["Le vrai problème de l'Europe","Europe's real problem"],["ce n'est pas l'économie","isn't the economy (ce n'est pas = the negative of c'est)"],["c'est la sécurité et la défense","it's security and defense"]],"key":"<b>c'est / ce n'est pas, to close.</b> The story ends on the same set phrase it used to open explanations — naming what something is, and what it isn't."}}]],"grammar":[{"fr":"plus forts / moins longtemps / autant de choses que","en":"<b>Three ways to compare: plus … que, moins … que, autant de … que.</b> “More than,” “less than,” “as much/many as” — this story uses all three."},{"fr":"Depuis 2000, le revenu augmente","en":"<b>depuis + present tense = an action that started in the past and is still going.</b> French uses the present here where English reaches for “has been happening” — no extra tense needed."},{"fr":"Il y a plus de violence / Il y a une raison","en":"<b>il y a = “there is/are.”</b> A fixed phrase, unchanged whether one thing or many follow — it turns up twice in this story."}],"quiz":{"q":"Qu'est-ce qui explique presque tout le paradoxe entre les États-Unis et l'Europe ?","a":"Le secteur technologique, beaucoup plus grand aux États-Unis, explique presque toute la différence. (The tech sector, much bigger in the US, explains almost the whole gap.)"},"flag":"This compresses a Martin Wolf FT opinion column that itself summarises economist Paul Krugman's argument — it's one economist's interpretation, not settled consensus, though I kept the retelling neutral rather than argumentative. I dropped the named sources (Krugman, Seth Ackerman, the Draghi report) and the detailed GDP-measurement debate (hedonic price adjustments, growth-vs-level accounting) the original leans on heavily. The life-expectancy figure combines men's and women's averages, rounded; the prison figure (US vs Germany) is calculated from the article's per-100,000 numbers. <span class='fr'>le vrai pouvoir d'achat</span> stands in for the technical term <span class='fr'>parité de pouvoir d'achat</span> (purchasing power parity) — a native economist would likely use the fuller term."},{"id":"ai-philosophers","chip":"Philosophes de l'IA","kicker":"Technologie · Philosophie","title":"10. Les philosophes, nouveaux experts de l'IA","level":"A1","gist":"Ten years ago students were told to learn to code; now it's programmers who worry about AI taking their jobs, while philosophy graduates have lower unemployment and are being snapped up by AI labs. Companies use philosophical training — the Socratic method, humility about what a model doesn't know — to make AI less sycophantic and overconfident, and write “constitutions” of moral rules (like Anthropic's for Claude) drawing on two rival ethical frameworks: strict rules versus weighing consequences. Hard questions remain unresolved, so there's no shortage of work for philosophers of AI.","body":[[{"fr":"On dit souvent qu'il {{faut|is necessary, must}} apprendre à coder pour trouver un emploi facilement.","bd":{"meaning":"People often say you have to learn to code to find a job easily.","chunks":[["On dit souvent","people often say (on = people/you/we in general)"],["qu'il faut","that you have to / it's necessary to"],["apprendre à coder","learn to code"],["pour trouver un emploi facilement","to find a job easily (pour + plain verb = 'in order to')"]],"key":"<b>il faut + plain verb = “you have to / it's necessary to.”</b> <span class='bd-fr-i'>il faut</span> never changes form — it's always “il faut,” whoever is being told."}},{"fr":"Mais aujourd'hui, {{ce sont|it's — plural}} les programmeurs qui ont peur de perdre leur travail à cause de l'IA.","bd":{"meaning":"But today, it's the programmers who are afraid of losing their jobs because of AI.","chunks":[["Mais aujourd'hui","but today"],["ce sont les programmeurs","it's the programmers (ce sont = plural version of c'est)"],["qui ont peur de perdre","who are afraid of losing (avoir peur de = to be afraid of)"],["leur travail à cause de l'IA","their job(s) because of AI"]],"key":"<b>“ce sont” = the plural of “c'est.”</b> Use it when what follows is plural: <span class='bd-fr-i'>ce sont les programmeurs</span> = “it's the programmers.”"}}],[{"fr":"Une étude montre une chose {{surprenante|surprising}}.","bd":{"meaning":"A study shows something surprising.","chunks":[["Une étude montre","a study shows"],["une chose surprenante","a surprising thing (surprenante after the noun, agreeing feminine)"]],"key":"<b>Adjective after the noun, agreeing with it:</b> <span class='bd-fr-i'>chose</span> is feminine, so <span class='bd-fr-i'>surprenant</span> becomes <span class='bd-fr-i'>surprenante</span>."}},{"fr":"Les {{diplômés en philosophie|philosophy graduates}} trouvent un emploi plus facilement que les diplômés en informatique.","bd":{"meaning":"Philosophy graduates find a job more easily than computer science graduates.","chunks":[["Les diplômés en philosophie","philosophy graduates (diplômé = graduate)"],["trouvent un emploi","find a job"],["plus facilement que","more easily than (plus + adverb + que)"],["les diplômés en informatique","computer science graduates"]],"key":"<b>plus + adverb + que = “more ___ than.”</b> Same comparison shape you use with adjectives, here applied to <span class='bd-fr-i'>facilement</span> (easily)."}}],[{"fr":"Beaucoup d'entreprises d'IA {{embauchent|hire}} maintenant des philosophes.","bd":{"meaning":"Many AI companies now hire philosophers.","chunks":[["Beaucoup d'entreprises d'IA","many AI companies"],["embauchent","hire (embaucher, ils/elles form)"],["maintenant","now"],["des philosophes","philosophers"]],"key":"<b>-ent ending = plural subject.</b> <span class='bd-fr-i'>embauchent</span> tells you the subject (les entreprises) is plural, even though you don't hear the ending."}},{"fr":"Des étudiants {{reçoivent|receive}} une offre d'emploi avant même de finir leurs études.","bd":{"meaning":"Students receive a job offer before they've even finished their studies.","chunks":[["Des étudiants reçoivent","students receive (recevoir)"],["une offre d'emploi","a job offer"],["avant même de finir","before even finishing (avant de + plain verb)"],["leurs études","their studies"]],"key":"<b>avant de + plain verb = “before ___ing.”</b> Like <span class='bd-fr-i'>pour</span>, the verb after <span class='bd-fr-i'>avant de</span> stays plain: <span class='bd-fr-i'>avant de finir</span> = “before finishing.”"}}],[{"fr":"Les IA disent souvent oui à tout, pour {{plaire|please}} aux utilisateurs.","bd":{"meaning":"AIs often say yes to everything, to please users.","chunks":[["Les IA disent souvent oui à tout","AIs often say yes to everything"],["pour plaire","to please (pour + plain verb)"],["aux utilisateurs","to users (aux = à + les)"]],"key":"<b>pour + plain verb, again.</b> <span class='bd-fr-i'>pour plaire</span> = “to please” — the same “in order to” shape from earlier stories."}},{"fr":"La méthode de Socrate, un {{philosophe grec|Greek philosopher}}, apprend à un modèle à poser des questions et à chercher la vérité.","bd":{"meaning":"Socrates's method, a Greek philosopher, teaches a model to ask questions and seek the truth.","chunks":[["La méthode de Socrate","Socrates's method (de = 's)"],["un philosophe grec","a Greek philosopher (grec after the noun)"],["apprend à un modèle à poser des questions","teaches a model to ask questions (apprendre à qqn à + verb)"],["et à chercher la vérité","and to seek the truth"]],"key":"<b>apprendre à qqn à + plain verb = “to teach someone to ___.”</b> Two <span class='bd-fr-i'>à</span>'s in a row: one for the person, one before the verb."}}],[{"fr":"Une autre idée de Socrate dit qu'il faut savoir {{qu'on ne sait pas tout|that we don't know everything}}.","bd":{"meaning":"Another idea of Socrates says you have to know that you don't know everything.","chunks":[["Une autre idée de Socrate dit","another idea of Socrates says"],["qu'il faut savoir","that you have to know"],["qu'on ne sait pas tout","that we don't know everything (ne...pas around sait)"]],"key":"<b>ne … pas around “sait”:</b> <span class='bd-fr-i'>on ne sait pas tout</span> = “we don't know everything” — the familiar negation sandwich, one more time."}},{"fr":"Cette {{humilité|humility}} aide l'IA à être moins sûre d'elle et à inventer moins de fausses informations.","bd":{"meaning":"This humility helps AI be less overconfident and invent less false information.","chunks":[["Cette humilité aide l'IA à être","this humility helps AI be (aider qqn à + verb)"],["moins sûre d'elle","less sure of itself / less overconfident"],["et à inventer moins","and invent less"],["de fausses informations","false information (fausses before the noun here)"]],"key":"<b>aider qqn à + plain verb = “help someone (to) ___.”</b> <span class='bd-fr-i'>aide l'IA à être</span> = “helps AI (to) be.”"}}],[{"fr":"Certaines entreprises écrivent une « {{constitution|constitution}} » pour leur IA.","bd":{"meaning":"Some companies write a 'constitution' for their AI.","chunks":[["Certaines entreprises écrivent","some companies write (écrire)"],["une « constitution »","a 'constitution'"],["pour leur IA","for their AI"]],"key":"<b>“certaines” = “some” (feminine).</b> It agrees with the noun it introduces — here <span class='bd-fr-i'>entreprises</span>, feminine plural."}},{"fr":"C'est une longue {{liste de règles morales|list of moral rules}}.","bd":{"meaning":"It's a long list of moral rules.","chunks":[["C'est","it is / that's"],["une longue liste","a long list (longue before the noun)"],["de règles morales","of moral rules (morales after, agreeing feminine plural)"]],"key":"<b>Some adjectives go before, some after.</b> <span class='bd-fr-i'>longue</span> (long) comes before the noun, but <span class='bd-fr-i'>morales</span> (moral) comes after — most descriptive adjectives follow this second pattern."}},{"fr":"Anthropic, qui a créé le chatbot Claude, {{a écrit|wrote}} une constitution de 78 pages avec des idées de plusieurs philosophes.","bd":{"meaning":"Anthropic, which created the chatbot Claude, wrote a 78-page constitution with ideas from several philosophers.","chunks":[["Anthropic, qui a créé le chatbot Claude","Anthropic, which created the chatbot Claude"],["a écrit","wrote (a + écrit = past form of écrire)"],["une constitution de 78 pages","a 78-page constitution"],["avec des idées de plusieurs philosophes","with ideas from several philosophers"]],"key":"<b>Past = avoir + past participle, again.</b> <span class='bd-fr-i'>a écrit</span> = “wrote” — same pattern as <span class='bd-fr-i'>a inventé</span> from an earlier story."}}],[{"fr":"Il {{existe|exists — there are}} deux grandes façons de penser la morale.","bd":{"meaning":"There are two big ways of thinking about morality.","chunks":[["Il existe","there exist(s) / there are (a formal cousin of 'il y a')"],["deux grandes façons","two big ways (grandes before the noun)"],["de penser la morale","of thinking about morality"]],"key":"<b>“Il existe” = another way to say “there is/are.”</b> Slightly more formal than <span class='bd-fr-i'>il y a</span>, but works the same way."}},{"fr":"La première dit que certaines actions sont {{toujours interdites|always forbidden}}, comme mentir.","bd":{"meaning":"The first says that certain actions are always forbidden, like lying.","chunks":[["La première dit que","the first (one) says that"],["certaines actions sont toujours interdites","certain actions are always forbidden"],["comme mentir","like lying (plain verb used as a noun)"]],"key":"<b>A plain verb can act like a noun.</b> <span class='bd-fr-i'>mentir</span> here means “lying” — French often uses the plain verb where English adds “-ing.”"}},{"fr":"La deuxième regarde seulement les {{conséquences|consequences}} avant de choisir une action.","bd":{"meaning":"The second only looks at the consequences before choosing an action.","chunks":[["La deuxième regarde seulement","the second (one) only looks at"],["les conséquences","the consequences"],["avant de choisir une action","before choosing an action"]],"key":"<b>avant de + plain verb, once more.</b> <span class='bd-fr-i'>avant de choisir</span> = “before choosing” — same shape as <span class='bd-fr-i'>avant de finir</span> earlier."}},{"fr":"Les {{voitures autonomes|self-driving cars}} utilisent cette deuxième idée pour décider quoi faire avant un accident.","bd":{"meaning":"Self-driving cars use this second idea to decide what to do before an accident.","chunks":[["Les voitures autonomes utilisent","self-driving cars use"],["cette deuxième idée","this second idea"],["pour décider quoi faire","to decide what to do (pour + plain verb)"],["avant un accident","before an accident"]],"key":"<b>pour + plain verb, back again.</b> <span class='bd-fr-i'>pour décider</span> = “to decide” — this “in order to” shape is everywhere once you notice it."}}],[{"fr":"Mais des questions {{difficiles|difficult}} restent sans réponse.","bd":{"meaning":"But difficult questions remain unanswered.","chunks":[["Mais des questions difficiles","but difficult questions (difficiles after the noun)"],["restent","remain (rester)"],["sans réponse","without an answer (sans = without, no article after it)"]],"key":"<b>“sans” drops the article,</b> just like <span class='bd-fr-i'>sans avocat</span> earlier: <span class='bd-fr-i'>sans réponse</span> = “without an answer,” not “without a answer.”"}},{"fr":"{{Est-ce que|is it that — question marker}} l'IA doit aussi protéger les animaux et la nature ?","bd":{"meaning":"Should AI also protect animals and nature?","chunks":[["Est-ce que","question marker — turns a statement into a yes/no question"],["l'IA doit aussi protéger","AI must/should also protect (devoir + plain verb)"],["les animaux et la nature","animals and nature"]],"key":"<b>Est-ce que + statement = a yes/no question.</b> Drop it in front of any sentence — <span class='bd-fr-i'>l'IA doit protéger…</span> becomes a question, word order unchanged."}},{"fr":"Une chose est {{sûre|certain, sure}} : les philosophes ont beaucoup de travail avec l'intelligence artificielle.","bd":{"meaning":"One thing is certain: philosophers have plenty of work with artificial intelligence.","chunks":[["Une chose est sûre","one thing is certain"],["les philosophes ont","philosophers have"],["beaucoup de travail","a lot of work"],["avec l'intelligence artificielle","with artificial intelligence"]],"key":"<b>“avoir beaucoup de ___” = “to have a lot of ___.”</b> Simple and everyday — swap in any noun after <span class='bd-fr-i'>beaucoup de</span>."}}]],"grammar":[{"fr":"Il faut apprendre à coder","en":"<b>il faut + plain verb = “you have to / it's necessary to.”</b> A fixed, unchanging phrase — no matter who's being told, it's always <span class='fr'>il faut</span>."},{"fr":"avant de finir / avant de choisir","en":"<b>avant de + plain verb = “before ___ing.”</b> The verb after <span class='fr'>avant de</span> stays plain, just like after <span class='fr'>pour</span>."},{"fr":"Anthropic a écrit une constitution","en":"<b>avoir + past participle = the past (passé composé).</b> <span class='fr'>a écrit</span> = “wrote” — your “past = avoir/être + verb” key, showing up again."}],"quiz":{"q":"Pourquoi Anthropic a-t-il écrit une « constitution » pour Claude ?","a":"Pour donner à l'IA des règles morales claires, basées sur les idées de plusieurs philosophes. (To give the AI clear moral rules, based on the ideas of several philosophers.)"},"flag":"Heavy compression: the original names many philosophers and executives (Floridi, Noller, Gabriel, Powers, Rossi, Bostrom, Heck, Yampolskiy) and specific products (IBM's Granite, Inflection's Pi, Waymo, Google DeepMind) — I dropped all of them to keep the story to two ideas (the Socratic method, AI constitutions) and two ethical frameworks (strict rules vs. weighing consequences). The 7%/5.1% unemployment figures and the 78-page Claude constitution are accurate to the article; everything else is simplified. A native speaker might say <span class='fr'>philosophie morale</span> rather than just <span class='fr'>la morale</span> in one sentence, and the real French terms <span class='fr'>déontologie</span> / <span class='fr'>conséquentialisme</span> exist — I avoided them here as too technical for A1."},{"id":"status-death","chip":"La mort du statut","kicker":"Économie · Société","title":"11. Le grand chamboulement du statut social","level":"A1","gist":"A hedge-fund worker feels miserable because friends in AI are getting richer faster than him — an example of what The Economist's Schumpeter column calls “status death,” as capitalism's usual ways of ranking people get disrupted. Luxury brands like LVMH and Ferrari are losing their shine because they became too accessible, banks use elaborate fake titles to soften status loss, Silicon Valley workers fear AI will make them obsolete, and even Donald Trump will eventually face his own demotion when he leaves office. The one silver lining: fear of losing status pushes people to quit and try something new.","body":[[{"fr":"Les gens adorent comparer leur {{statut|status}} avec celui des autres.","bd":{"meaning":"People love comparing their status with other people's.","chunks":[["Les gens adorent comparer","people love comparing/to compare"],["leur statut","their status"],["avec celui des autres","with that of others (celui = 'the one', stands in for 'statut')"]],"key":"<b>“celui” replaces a noun</b> to avoid repeating it: <span class='bd-fr-i'>celui des autres</span> = “that of others,” instead of saying “le statut des autres” again."}},{"fr":"Même les {{patrons|bosses}} des grandes entreprises passent du temps sur LinkedIn pour montrer leurs succès.","bd":{"meaning":"Even the bosses of big companies spend time on LinkedIn to show off their successes.","chunks":[["Même les patrons","even the bosses"],["des grandes entreprises","of big companies (grandes before the noun)"],["passent du temps sur LinkedIn","spend time on LinkedIn"],["pour montrer leurs succès","to show their successes (pour + plain verb)"]],"key":"<b>pour + plain verb, once more.</b> <span class='bd-fr-i'>pour montrer</span> = “to show” — the same “in order to” shape you've seen before."}}],[{"fr":"Aujourd'hui, beaucoup de gens vivent ce qu'on appelle {{« la mort du statut »|\"status death\"}}.","bd":{"meaning":"Today, many people experience what's called 'status death.'","chunks":[["Aujourd'hui, beaucoup de gens vivent","today, many people experience/live"],["ce qu'on appelle","what people call (ce que + on appelle)"],["« la mort du statut »","'status death'"]],"key":"<b>“ce que” + on + verb = “what people ___.”</b> <span class='bd-fr-i'>ce qu'on appelle</span> = “what is called” — a handy way to introduce a term."}},{"fr":"Un jeune {{banquier|banker}} très riche est triste parce que ses amis, qui travaillent dans l'intelligence artificielle, gagnent encore plus d'argent que lui.","bd":{"meaning":"A very rich young banker is sad because his friends, who work in AI, earn even more money than him.","chunks":[["Un jeune banquier très riche est triste","a very rich young banker is sad"],["parce que ses amis","because his friends"],["qui travaillent dans l'intelligence artificielle","who work in AI (qui = who/that)"],["gagnent encore plus d'argent que lui","earn even more money than him"]],"key":"<b>“que lui” for comparison after a pronoun.</b> After <span class='bd-fr-i'>plus … que</span>, “him” becomes the standalone form <span class='bd-fr-i'>lui</span>, not “il.”"}}],[{"fr":"Les marques de luxe connaissent le même problème.","bd":{"meaning":"Luxury brands face the same problem.","chunks":[["Les marques de luxe","luxury brands"],["connaissent","know / experience (connaître, ils/elles form)"],["le même problème","the same problem"]],"key":"<b>“même” before the noun = “the same.”</b> <span class='bd-fr-i'>le même problème</span> = “the same problem” — don't confuse with <span class='bd-fr-i'>même</span> meaning “even,” which turns up elsewhere."}},{"fr":"Les {{sacs à main|handbags}} de LVMH et de Kering, deux grandes entreprises françaises, se vendent moins bien.","bd":{"meaning":"Handbags from LVMH and Kering, two big French companies, are selling less well.","chunks":[["Les sacs à main de LVMH et de Kering","handbags from LVMH and Kering"],["deux grandes entreprises françaises","two big French companies"],["se vendent","sell (se vendre = 'to sell' in the sense of 'to be sold')"],["moins bien","less well"]],"key":"<b>“se vendre” = “to sell” (be sold).</b> French often uses this reflexive shape for “X sells well/badly,” where English just says “sells.”"}},{"fr":"Pendant longtemps, ces marques ont vendu leurs produits à trop de gens, alors elles ont perdu {{leur image exclusive|their exclusive image}}.","bd":{"meaning":"For a long time, these brands sold their products to too many people, so they lost their exclusive image.","chunks":[["Pendant longtemps","for a long time"],["ces marques ont vendu leurs produits","these brands sold their products"],["à trop de gens","to too many people"],["alors elles ont perdu leur image exclusive","so they lost their exclusive image"]],"key":"<b>Past = avoir + past participle, twice in one sentence.</b> <span class='bd-fr-i'>ont vendu</span> and <span class='bd-fr-i'>ont perdu</span> both follow the same “avoir + past form” pattern."}}],[{"fr":"Les voitures électriques chinoises, moins chères, ont {{cassé|broken, shattered}} l'image exclusive du secteur automobile de luxe.","bd":{"meaning":"Cheaper Chinese electric cars have shattered the exclusive image of the luxury car sector.","chunks":[["Les voitures électriques chinoises","Chinese electric cars"],["moins chères","cheaper (moins + adjective)"],["ont cassé","have broken/shattered (casser)"],["l'image exclusive du secteur automobile de luxe","the exclusive image of the luxury car sector"]],"key":"<b>moins + adjective, reused.</b> <span class='bd-fr-i'>moins chères</span> = “cheaper” — same comparative shape as <span class='bd-fr-i'>moins cher</span> from an earlier story, here feminine plural to agree with “voitures.”"}},{"fr":"À cause de ça, les clients ont mal réagi à la première voiture électrique de Ferrari.","bd":{"meaning":"Because of that, customers reacted badly to Ferrari's first electric car.","chunks":[["À cause de ça","because of that"],["les clients ont mal réagi","customers reacted badly (mal = badly, sits after 'ont')"],["à la première voiture électrique de Ferrari","to Ferrari's first electric car"]],"key":"<b>“mal” + past participle = “badly ___ed.”</b> Small adverbs like <span class='bd-fr-i'>mal</span> slot in right after the helper verb, before the past participle."}}],[{"fr":"Dans la finance, les banques utilisent des {{titres compliqués|complicated titles}} pour cacher la perte de statut de leurs employés.","bd":{"meaning":"In finance, banks use complicated titles to hide their employees' loss of status.","chunks":[["Dans la finance, les banques utilisent","in finance, banks use"],["des titres compliqués","complicated titles"],["pour cacher","to hide (pour + plain verb)"],["la perte de statut de leurs employés","their employees' loss of status"]],"key":"<b>pour + plain verb, yet again.</b> <span class='bd-fr-i'>pour cacher</span> = “to hide” — by now you can spot this pattern anywhere."}},{"fr":"Par exemple, chez Goldman Sachs, le titre de « {{partenaire|partner}} » existe encore, même si la banque n'est plus une vraie société de partenaires.","bd":{"meaning":"For example, at Goldman Sachs, the title of 'partner' still exists, even though the bank is no longer really a partnership.","chunks":[["Par exemple, chez Goldman Sachs","for example, at Goldman Sachs (chez = at the place/company of)"],["le titre de « partenaire » existe encore","the title of 'partner' still exists"],["même si","even though / even if"],["la banque n'est plus une vraie société de partenaires","the bank is no longer really a partnership (ne...plus = no longer)"]],"key":"<b>ne … plus = “no longer / not anymore.”</b> A cousin of <span class='bd-fr-i'>ne … pas</span> — same sandwich shape, different meaning."}}],[{"fr":"La Silicon Valley se présente comme un endroit {{sans hiérarchie|without hierarchy}}.","bd":{"meaning":"Silicon Valley presents itself as a place without hierarchy.","chunks":[["La Silicon Valley se présente comme","Silicon Valley presents itself as"],["un endroit sans hiérarchie","a place without hierarchy (sans = without, no article after it)"]],"key":"<b>“sans” drops the article, again.</b> <span class='bd-fr-i'>sans hiérarchie</span> = “without hierarchy” — same rule as <span class='bd-fr-i'>sans avocat</span> and <span class='bd-fr-i'>sans réponse</span>."}},{"fr":"Mais en réalité, ses employés ont très peur que l'intelligence artificielle {{remplace|replace}} leur travail.","bd":{"meaning":"But in reality, its employees are very afraid that AI will replace their jobs.","chunks":[["Mais en réalité","but in reality"],["ses employés ont très peur que","its employees are very afraid that"],["l'intelligence artificielle remplace","AI (will) replace"],["leur travail","their job(s)"]],"key":"<b>avoir peur que + verb = “to be afraid that ___.”</b> A useful pattern for expressing worry about something happening."}}],[{"fr":"Le président Donald Trump illustre bien cette {{peur du statut perdu|fear of lost status}}.","bd":{"meaning":"President Donald Trump illustrates this fear of lost status well.","chunks":[["Le président Donald Trump illustre bien","President Donald Trump illustrates well"],["cette peur du statut perdu","this fear of lost status"]],"key":"<b>Past participle as adjective:</b> <span class='bd-fr-i'>perdu</span> (lost, from perdre) describes “statut” just like a regular adjective — many past participles work this way."}},{"fr":"Il attaque souvent les universités et les médias, {{deux institutions|two institutions}} qui donnent normalement du prestige.","bd":{"meaning":"He often attacks universities and the media, two institutions that normally give prestige.","chunks":[["Il attaque souvent","he often attacks"],["les universités et les médias","universities and the media"],["deux institutions qui donnent normalement","two institutions that normally give (qui = that/which)"],["du prestige","prestige"]],"key":"<b>“qui” hooks on more description,</b> as before: “two institutions THAT normally give prestige.”"}},{"fr":"Mais un jour, il {{va quitter|is going to leave}} son poste, et il va perdre beaucoup de statut.","bd":{"meaning":"But one day, he's going to leave his position, and he's going to lose a lot of status.","chunks":[["Mais un jour","but one day"],["il va quitter son poste","he's going to leave his position (aller + plain verb)"],["et il va perdre","and he's going to lose"],["beaucoup de statut","a lot of status"]],"key":"<b>aller + plain verb = the future, twice in one sentence.</b> <span class='bd-fr-i'>va quitter</span> and <span class='bd-fr-i'>va perdre</span> both use the same “aller + plain verb” shape."}}],[{"fr":"Heureusement, la peur de perdre son statut n'est pas seulement {{négative|negative}}.","bd":{"meaning":"Fortunately, the fear of losing your status isn't only negative.","chunks":[["Heureusement","fortunately"],["la peur de perdre son statut","the fear of losing one's status"],["n'est pas seulement négative","isn't only negative (ne...pas + seulement)"]],"key":"<b>ne … pas seulement = “not only.”</b> The negation sandwich wraps around “seulement” to soften a claim rather than deny it fully."}},{"fr":"Elle {{pousse|pushes, drives}} aussi les gens à changer de travail et à créer de nouvelles choses.","bd":{"meaning":"It also drives people to change jobs and create new things.","chunks":[["Elle pousse aussi les gens à","it also pushes/drives people to"],["changer de travail","change jobs"],["et à créer de nouvelles choses","and create new things"]],"key":"<b>pousser qqn à + plain verb = “to drive/push someone to ___.”</b> Same shape as <span class='bd-fr-i'>aider qqn à</span> — a person, then à, then the plain verb."}},{"fr":"Le jeune banquier du début de cette histoire a finalement {{quitté|quit, left}} son emploi pour chercher plus d'argent, et surtout, plus de statut.","bd":{"meaning":"The young banker from the start of this story finally quit his job to look for more money, and above all, more status.","chunks":[["Le jeune banquier du début de cette histoire","the young banker from the start of this story"],["a finalement quitté son emploi","finally quit his job (a...quitté = past form)"],["pour chercher plus d'argent","to look for more money"],["et surtout, plus de statut","and above all, more status"]],"key":"<b>Past = avoir + past participle, to close.</b> <span class='bd-fr-i'>a quitté</span> = “quit” — the same pattern this story has used throughout to talk about what already happened."}}]],"grammar":[{"fr":"La banque n'est plus une société de partenaires","en":"<b>ne … plus = “no longer / not anymore.”</b> Same sandwich shape as <span class='fr'>ne … pas</span>, but it marks something that used to be true and isn't now."},{"fr":"Elle pousse les gens à changer de travail","en":"<b>pousser / aider / apprendre qqn à + plain verb = “to get someone to ___.”</b> A family of verbs that all use the same shape: person, then à, then a plain verb."},{"fr":"Il va quitter son poste","en":"<b>aller + plain verb = the near future.</b> Only <span class='fr'>aller</span> changes with the subject; the second verb stays plain. Your “future = aller + verb” key, again."}],"quiz":{"q":"Pourquoi les marques de luxe comme LVMH perdent-elles leur statut ?","a":"Parce qu'elles ont vendu leurs produits à trop de gens et ont perdu leur image exclusive. (Because they sold their products to too many people and lost their exclusive image.)"},"flag":"This retells a witty Economist “Schumpeter” opinion column, so the compression is heavier than usual: I dropped the Hermès-tie anecdote, the front/middle/back-office bank hierarchy, Nike's leisurewear pivot, Knight Frank's luxury index, and the section on Trump's children striking business deals. <span class='fr'>la mort du statut</span> is my own translation of the column's coined phrase “status death” — there's no established French equivalent, and a French writer covering the same idea might reach for <span class='fr'>déclassement</span> (downgrading) instead. The original is opinionated and sardonic; I flattened the tone to stay neutral, as instructed."},{"id":"china-long-arm","chip":"Le long bras de la Chine","kicker":"Chine · Droit international","title":"12. La Chine veut que ses lois s'appliquent partout","level":"A1","gist":"China has long resented the US for enforcing its laws abroad through sanctions, but is now doing the same — most strikingly by forcing Meta to unwind a $2bn AI acquisition in April. The shift traces back to the 2018 arrest of a Huawei executive in Canada at America's request, after which China built a body of extraterritorial law: a 2021 anti-sanctions law now being used to sue JPMorgan and Citigroup in Chinese courts, and conflicting London/Chinese court rulings that leave firms like Samsung caught between two legal systems. China is also using new laws to police criticism of itself abroad, part of a broader push to centralize control and stop being, in its own telling, a victim of world history rather than its maker.","body":[[{"fr":"Pendant longtemps, la Chine a {{critiqué|criticized}} les pays étrangers qui appliquaient leurs propres lois sur son territoire.","bd":{"meaning":"For a long time, China criticized foreign countries that applied their own laws on its territory.","chunks":[["Pendant longtemps","for a long time"],["la Chine a critiqué","China criticized (a...critiqué = past form)"],["les pays étrangers","foreign countries"],["qui appliquaient leurs propres lois","that applied their own laws (qui = that/which)"],["sur son territoire","on its territory"]],"key":"<b>Past = avoir + past participle.</b> <span class='bd-fr-i'>a critiqué</span> = “criticized” — the familiar avoir + past-form pattern."}},{"fr":"Mais aujourd'hui, la Chine fait la même chose : elle veut appliquer ses lois {{en dehors de|outside of}} ses frontières.","bd":{"meaning":"But today, China is doing the same thing: it wants to apply its laws outside its borders.","chunks":[["Mais aujourd'hui","but today"],["la Chine fait la même chose","China does/is doing the same thing"],["elle veut appliquer ses lois","it wants to apply its laws (vouloir + plain verb)"],["en dehors de ses frontières","outside its borders"]],"key":"<b>vouloir + plain verb = “to want to ___.”</b> <span class='bd-fr-i'>veut appliquer</span> = “wants to apply” — another helper-plus-plain-verb pair."}}],[{"fr":"En avril, la Chine a {{obligé|forced}} Meta, le propriétaire de Facebook, à annuler un achat de 2 milliards de dollars.","bd":{"meaning":"In April, China forced Meta, Facebook's owner, to cancel a $2 billion purchase.","chunks":[["En avril, la Chine a obligé","in April, China forced (obliger qqn à = to force someone to)"],["Meta, le propriétaire de Facebook","Meta, Facebook's owner"],["à annuler","to cancel"],["un achat de 2 milliards de dollars","a $2 billion purchase (milliard = billion)"]],"key":"<b>obliger qqn à + plain verb = “to force someone to ___.”</b> Same shape as <span class='bd-fr-i'>aider qqn à</span> and <span class='bd-fr-i'>pousser qqn à</span> — a person, à, then the plain verb."}},{"fr":"Meta voulait acheter Manus, une entreprise d'IA, mais le gouvernement chinois a dit non.","bd":{"meaning":"Meta wanted to buy Manus, an AI company, but the Chinese government said no.","chunks":[["Meta voulait acheter Manus","Meta wanted to buy Manus (voulait = imperfect of vouloir)"],["une entreprise d'IA","an AI company"],["mais le gouvernement chinois a dit non","but the Chinese government said no"]],"key":"<b>“voulait” = “wanted” (an ongoing past state).</b> Different from <span class='bd-fr-i'>a voulu</span> — <span class='bd-fr-i'>voulait</span> paints the wanting as a background situation, not a single completed action."}}],[{"fr":"Ce tournant vient d'un événement {{précis|specific}}.","bd":{"meaning":"This turning point comes from a specific event.","chunks":[["Ce tournant vient de","this turning point comes from"],["un événement précis","a specific event (précis after the noun)"]],"key":"<b>venir de + noun = “to come from ___.”</b> A simple way to point back at a cause."}},{"fr":"En 2018, une {{directrice|(female) executive}} de Huawei a été arrêtée au Canada, à la demande des États-Unis.","bd":{"meaning":"In 2018, a Huawei executive was arrested in Canada, at the request of the United States.","chunks":[["En 2018, une directrice de Huawei","in 2018, a (female) Huawei executive"],["a été arrêtée","was arrested (être + past participle = the passive)"],["au Canada","in Canada"],["à la demande des États-Unis","at the request of the United States"]],"key":"<b>être + past participle = the passive (“was ___ed”).</b> <span class='bd-fr-i'>a été arrêtée</span> = “was arrested” — the participle agrees in gender, so it gets an extra -e for “une directrice.”"}},{"fr":"Les dirigeants chinois ont compris que leurs entreprises étaient très {{vulnérables|vulnerable}} face aux lois américaines.","bd":{"meaning":"Chinese leaders understood that their companies were very vulnerable to American laws.","chunks":[["Les dirigeants chinois ont compris que","Chinese leaders understood that (comprendre)"],["leurs entreprises étaient très vulnérables","their companies were very vulnerable (étaient = imperfect of être)"],["face aux lois américaines","in the face of American laws"]],"key":"<b>“étaient” describes a past state,</b> while <span class='bd-fr-i'>ont compris</span> is the single moment of realizing it — two different past tenses working together."}}],[{"fr":"Depuis 2021, la Chine a une loi contre les entreprises qui {{respectent|comply with}} les sanctions étrangères.","bd":{"meaning":"Since 2021, China has had a law against companies that comply with foreign sanctions.","chunks":[["Depuis 2021, la Chine a une loi","since 2021, China has had a law"],["contre les entreprises","against companies"],["qui respectent les sanctions étrangères","that comply with foreign sanctions"]],"key":"<b>depuis + present tense, again.</b> <span class='bd-fr-i'>depuis 2021, la Chine a</span> = “since 2021, China has had” — French keeps the present where English switches to “has had.”"}},{"fr":"Par exemple, deux grandes banques américaines, JPMorgan et Citigroup, sont {{poursuivies|sued}} devant un tribunal chinois.","bd":{"meaning":"For example, two big American banks, JPMorgan and Citigroup, are being sued in a Chinese court.","chunks":[["Par exemple, deux grandes banques américaines","for example, two big American banks"],["JPMorgan et Citigroup","JPMorgan and Citigroup"],["sont poursuivies","are being sued (être + past participle, passive again)"],["devant un tribunal chinois","before a Chinese court"]],"key":"<b>être + past participle, once more.</b> <span class='bd-fr-i'>sont poursuivies</span> = “are (being) sued” — the same passive shape as <span class='bd-fr-i'>a été arrêtée</span>, now present tense and feminine plural."}},{"fr":"Elles doivent payer 44 millions de dollars, parce qu'elles ont {{gelé|frozen}} l'argent d'une entreprise chinoise sanctionnée par les États-Unis.","bd":{"meaning":"They have to pay $44 million, because they froze the money of a Chinese company sanctioned by the US.","chunks":[["Elles doivent payer 44 millions de dollars","they have to pay $44 million (devoir + plain verb)"],["parce qu'elles ont gelé","because they froze (avoir + past participle)"],["l'argent d'une entreprise chinoise","the money of a Chinese company"],["sanctionnée par les États-Unis","sanctioned by the US"]],"key":"<b>devoir + plain verb = “have to.”</b> <span class='bd-fr-i'>doivent payer</span> = “have to pay” — the same shape as <span class='bd-fr-i'>doit payer</span> from an earlier story, now plural."}}],[{"fr":"Cette situation crée un vrai problème pour les entreprises {{internationales|international}}.","bd":{"meaning":"This situation creates a real problem for international companies.","chunks":[["Cette situation crée","this situation creates"],["un vrai problème","a real problem (vrai before the noun)"],["pour les entreprises internationales","for international companies"]],"key":"<b>“vrai” before the noun,</b> as you've seen before — a handful of common adjectives (vrai, bon, grand, petit) go before rather than after."}},{"fr":"En mai, un tribunal à Londres et un tribunal en Chine ont donné deux décisions {{différentes|different}} dans un même conflit entre Samsung et ZTE.","bd":{"meaning":"In May, a court in London and a court in China gave two different rulings in the same dispute between Samsung and ZTE.","chunks":[["En mai, un tribunal à Londres","in May, a court in London"],["et un tribunal en Chine","and a court in China"],["ont donné deux décisions différentes","gave two different rulings"],["dans un même conflit entre Samsung et ZTE","in the same dispute between Samsung and ZTE"]],"key":"<b>“en Chine” vs “à Londres.”</b> Countries use <span class='bd-fr-i'>en</span>, cities use <span class='bd-fr-i'>à</span> — two different little words for “in.”"}},{"fr":"Samsung doit maintenant choisir : {{obéir|obey}} au tribunal anglais, ou obéir au tribunal chinois.","bd":{"meaning":"Samsung now has to choose: obey the English court, or obey the Chinese court.","chunks":[["Samsung doit maintenant choisir","Samsung now has to choose (devoir + plain verb)"],["obéir au tribunal anglais","obey the English court (obéir à = to obey)"],["ou obéir au tribunal chinois","or obey the Chinese court"]],"key":"<b>obéir à = “to obey.”</b> A fixed pairing — in French you always “obey TO” someone, with <span class='bd-fr-i'>à</span>."}}],[{"fr":"La Chine utilise aussi ses nouvelles lois pour {{contrôler|control}} les critiques à l'étranger.","bd":{"meaning":"China also uses its new laws to control criticism abroad.","chunks":[["La Chine utilise aussi ses nouvelles lois","China also uses its new laws"],["pour contrôler","to control (pour + plain verb)"],["les critiques à l'étranger","criticism abroad"]],"key":"<b>pour + plain verb, one more time.</b> <span class='bd-fr-i'>pour contrôler</span> = “to control” — this “in order to” shape has appeared throughout every story so far."}},{"fr":"Une loi de juillet {{interdit|forbids}} tout acte, même en dehors de la Chine, qui « nuit à l'unité nationale ».","bd":{"meaning":"A July law forbids any act, even outside China, that 'harms national unity.'","chunks":[["Une loi de juillet interdit","a July law forbids (interdire)"],["tout acte","any act"],["même en dehors de la Chine","even outside China"],["qui « nuit à l'unité nationale »","that 'harms national unity' (qui = that/which)"]],"key":"<b>“qui” again hooks on a description,</b> this time to “tout acte”: an act THAT harms national unity."}}],[{"fr":"Selon des experts, ce mouvement {{montre|shows}} la volonté de la Chine de centraliser son pouvoir.","bd":{"meaning":"According to experts, this movement shows China's desire to centralize its power.","chunks":[["Selon des experts","according to experts"],["ce mouvement montre","this movement shows"],["la volonté de la Chine de centraliser","China's desire to centralize (volonté de + plain verb)"],["son pouvoir","its power"]],"key":"<b>“selon” = “according to.”</b> A simple way to attribute an opinion or claim to someone else."}},{"fr":"En créant ces lois, le gouvernement chinois envoie aussi un message clair aux autres pays.","bd":{"meaning":"By creating these laws, the Chinese government also sends a clear message to other countries.","chunks":[["En créant ces lois","by creating these laws (en + -ant form = 'by ___ing')"],["le gouvernement chinois envoie aussi","the Chinese government also sends"],["un message clair","a clear message"],["aux autres pays","to other countries"]],"key":"<b>en + -ant form = “by ___ing.”</b> <span class='bd-fr-i'>en créant</span> = “by creating” — a new shape worth knowing: it describes how something is done."}}],[{"fr":"La Chine ne veut plus être seulement une {{victime|victim}} de l'histoire mondiale.","bd":{"meaning":"China no longer wants to be just a victim of world history.","chunks":[["La Chine ne veut plus être","China no longer wants to be (ne...plus = no longer)"],["seulement une victime","just/only a victim"],["de l'histoire mondiale","of world history"]],"key":"<b>ne … plus, to close this idea.</b> <span class='bd-fr-i'>ne veut plus</span> = “no longer wants” — the same sandwich you meet whenever something that used to be true stops being true."}},{"fr":"Elle veut maintenant {{écrire|write}} les règles elle-même.","bd":{"meaning":"It now wants to write the rules itself.","chunks":[["Elle veut maintenant écrire","it now wants to write (vouloir + plain verb)"],["les règles","the rules"],["elle-même","itself (emphatic pronoun + même)"]],"key":"<b>“elle-même” = “itself/herself.”</b> Add <span class='bd-fr-i'>même</span> after a pronoun to emphasize “by itself / on its own.”"}}]],"grammar":[{"fr":"Une directrice a été arrêtée / les banques sont poursuivies","en":"<b>être + past participle = the passive (“was/is ___ed”).</b> Unlike <span class='fr'>avoir + past participle</span> (the ordinary past), this shape says something was done TO the subject."},{"fr":"La banque n'est plus... / la Chine ne veut plus...","en":"<b>ne … plus = “no longer / not anymore.”</b> Same sandwich shape as <span class='fr'>ne … pas</span>, but marks something that used to be true and now isn't."},{"fr":"En créant ces lois","en":"<b>en + -ant form = “by ___ing.”</b> Describes the means or manner of an action — <span class='fr'>en créant</span> = “by creating.”"}],"quiz":{"q":"Pourquoi la Chine a-t-elle obligé Meta à annuler l'achat de Manus ?","a":"Parce que la Chine renforce son contrôle sur les technologies d'intelligence artificielle et travaille sur de nouvelles lois pour mieux contrôler ces technologies. (Because China is tightening control over AI technology and working on new laws to better control it.)"},"flag":"This compresses a dense Economist piece with several named legal experts (Henry Gao, Mark Jia, Yalkun Uluyol) and additional laws — the entry/exit-ban rules taking effect in September, the EU-style “blocking statute” comparison, a pending cyber-crime bill, a corruption-evidence law, and older tactics like covert police stations and kidnapped dissidents — all dropped to focus on three concrete threads: the Meta/Manus deal, the JPMorgan/Citigroup lawsuits, and the Samsung/ZTE court clash. The $44m figure is the combined total from the article, not one single lawsuit. <span class='fr'>tournant</span> (turning point) and <span class='fr'>long bras</span> (long arm) are natural-sounding choices for ideas the article treats more abstractly — a native speaker might reach directly for the technical term <span class='fr'>extraterritorialité</span>, which I avoided as too advanced for A1."},{"id":"two-masters","chip":"Deux lois, un problème","kicker":"Chine · États-Unis · Entreprises","title":"13. Une entreprise, deux lois","level":"A1","gist":"Multinational companies increasingly find themselves stuck between American and Chinese law: obeying one often means breaking the other. China is suing JPMorgan and Citigroup for following US sanctions rules, and forced Meta to unwind a $2bn AI deal (Manus). A new Chinese law taking effect in September will let China stop people from leaving the country. Firms are splitting off their China operations to limit the risk.","body":[[{"fr":"Une grande entreprise américaine travaille aussi {{en Chine|in China}}.","bd":{"meaning":"A big American company also works in China.","chunks":[["Une grande entreprise américaine","a big American company (grande before the noun)"],["travaille","works"],["aussi","also"],["en Chine","in China"]],"key":"<b>en + country = “in.”</b> Use <span class='bd-fr-i'>en</span> before feminine countries like <span class='bd-fr-i'>la Chine</span>."}},{"fr":"Elle {{doit respecter|has to follow}} les lois américaines et les lois chinoises.","bd":{"meaning":"It has to follow American laws and Chinese laws.","chunks":[["Elle doit respecter","it has to follow"],["les lois américaines","American laws"],["et","and"],["les lois chinoises","Chinese laws"]],"key":"<b>devoir + plain verb = “has to.”</b> Only <span class='bd-fr-i'>doit</span> changes; <span class='bd-fr-i'>respecter</span> stays plain."}},{"fr":"Mais parfois, les deux lois {{se contredisent|contradict each other}}.","bd":{"meaning":"But sometimes, the two laws contradict each other.","chunks":[["Mais parfois","but sometimes"],["les deux lois","the two laws"],["se contredisent","contradict each other"]],"key":"<b>se + verb = a reflexive action.</b> <span class='bd-fr-i'>se contredire</span> = “to contradict each other/itself.”"}},{"fr":"{{Obéir|to obey}} à une loi, {{c'est|that means}} {{désobéir|disobey}} à l'autre.","bd":{"meaning":"Obeying one law means disobeying the other.","chunks":[["Obéir à une loi","obeying one law"],["c'est","that is / that means"],["désobéir à l'autre","disobeying the other"]],"key":"<b>“X, c'est Y” = “X means Y.”</b> <span class='bd-fr-i'>c'est</span> links two ideas together."}}],[{"fr":"Par exemple, deux grandes banques américaines, JPMorgan et Citigroup, {{ont un problème|have a problem}} en Chine.","bd":{"meaning":"For example, two big American banks, JPMorgan and Citigroup, have a problem in China.","chunks":[["Par exemple","for example"],["deux grandes banques américaines","two big American banks"],["JPMorgan et Citigroup","JPMorgan and Citigroup"],["ont un problème","have a problem"],["en Chine","in China"]],"key":"<b>“ont” = “have.”</b> The plural (ils/elles) form of <span class='bd-fr-i'>avoir</span>."}},{"fr":"Des tribunaux chinois {{poursuivent|are suing}} les deux banques.","bd":{"meaning":"Chinese courts are suing both banks.","chunks":[["Des tribunaux chinois","Chinese courts"],["poursuivent","are suing"],["les deux banques","both banks"]],"key":"<b>French present covers English “is/are -ing.”</b> No separate continuous form is needed: <span class='bd-fr-i'>poursuivent</span> = “sue” or “are suing.”"}},{"fr":"Les banques {{ont seulement obéi|only obeyed}} au gouvernement américain.","bd":{"meaning":"The banks only obeyed the American government.","chunks":[["Les banques ont obéi","the banks obeyed"],["seulement","only"],["au gouvernement américain","the American government"]],"key":"<b>avoir + past participle = the past.</b> <span class='bd-fr-i'>ont obéi</span> = “obeyed.”"}},{"fr":"Elles {{suivent|follow}} les règles américaines contre certaines entreprises chinoises.","bd":{"meaning":"They follow American rules against certain Chinese companies.","chunks":[["Elles suivent","they follow"],["les règles américaines","American rules"],["contre certaines entreprises chinoises","against certain Chinese companies"]],"key":"<b>Present tense covers ongoing habits:</b> <span class='bd-fr-i'>suivent</span> = “follow / are following.”"}}],[{"fr":"Un autre exemple : Meta {{a acheté|bought}} une petite entreprise d'IA, Manus, pour deux milliards de dollars.","bd":{"meaning":"Another example: Meta bought a small AI company, Manus, for two billion dollars.","chunks":[["Un autre exemple","another example"],["Meta a acheté","Meta bought"],["une petite entreprise d'IA","a small AI company"],["Manus","Manus"],["pour deux milliards de dollars","for two billion dollars"]],"key":"<b>avoir + past participle = the past.</b> <span class='bd-fr-i'>a acheté</span> = “bought.”"}},{"fr":"La Chine {{n'est pas d'accord|does not agree}}.","bd":{"meaning":"China does not agree.","chunks":[["La Chine","China"],["n'est pas d'accord","does not agree"]],"key":"<b>ne … pas sandwich</b> wraps around <span class='bd-fr-i'>est</span>. <span class='bd-fr-i'>être d'accord</span> is a fixed phrase for “to agree.”"}},{"fr":"Meta {{a annulé|cancelled}} l'achat {{pour rester|to stay}} en bons termes avec la Chine.","bd":{"meaning":"Meta cancelled the purchase to stay on good terms with China.","chunks":[["Meta a annulé l'achat","Meta cancelled the purchase"],["pour rester","to stay / in order to stay"],["en bons termes avec la Chine","on good terms with China"]],"key":"<b>pour + plain verb = “in order to.”</b> <span class='bd-fr-i'>rester</span> stays plain after <span class='bd-fr-i'>pour</span>."}}],[{"fr":"En septembre, une nouvelle loi chinoise {{va entrer en vigueur|will take effect}}.","bd":{"meaning":"In September, a new Chinese law will take effect.","chunks":[["En septembre","in September"],["une nouvelle loi chinoise","a new Chinese law"],["va entrer en vigueur","will take effect"]],"key":"<b>aller + plain verb = the near future.</b> Only <span class='bd-fr-i'>va</span> changes; <span class='bd-fr-i'>entrer</span> stays plain."}},{"fr":"Elle {{va permettre|will allow}} à la Chine d'{{empêcher|prevent}} des gens de {{quitter|leave}} le pays.","bd":{"meaning":"It will allow China to stop people from leaving the country.","chunks":[["Elle va permettre","it will allow"],["à la Chine d'empêcher","China to prevent"],["des gens de quitter","people from leaving"],["le pays","the country"]],"key":"<b>permettre à qqn de + verb = “allow someone to.”</b> Little words (<span class='bd-fr-i'>à</span>/<span class='bd-fr-i'>de</span>) link the two verbs together."}},{"fr":"Beaucoup d'entreprises {{ont peur|are afraid}} de cette nouvelle loi.","bd":{"meaning":"Many companies are afraid of this new law.","chunks":[["Beaucoup d'entreprises","many companies"],["ont peur","are afraid"],["de cette nouvelle loi","of this new law"]],"key":"<b>avoir peur = “to be afraid.”</b> French says “have fear,” not “be afraid.”"}}],[{"fr":"Alors, les entreprises {{séparent|separate}} leurs activités en Chine du reste du monde.","bd":{"meaning":"So, companies separate their China operations from the rest of the world.","chunks":[["Alors","so"],["les entreprises séparent","companies separate"],["leurs activités en Chine","their operations in China"],["du reste du monde","from the rest of the world"]],"key":"<b>“leurs” = their.</b> Just like <span class='bd-fr-i'>ses</span> is his/her, <span class='bd-fr-i'>leurs</span> doesn't show gender either."}},{"fr":"Elles gardent leurs {{données importantes|important data}} loin de la Chine.","bd":{"meaning":"They keep their important data far from China.","chunks":[["Elles gardent","they keep"],["leurs données importantes","their important data"],["loin de la Chine","far from China"]],"key":"<b>Adjectives echo the noun's gender/number:</b> <span class='bd-fr-i'>importantes</span> agrees with feminine plural <span class='bd-fr-i'>données</span>."}},{"fr":"Pour le moment, {{personne ne sait|nobody knows}} comment {{résoudre|solve}} ce problème.","bd":{"meaning":"For now, nobody knows how to solve this problem.","chunks":[["Pour le moment","for now"],["personne ne sait","nobody knows"],["comment résoudre","how to solve"],["ce problème","this problem"]],"key":"<b>“personne ne + verb” = “nobody ___.”</b> <span class='bd-fr-i'>personne</span> acts like a negative word, paired with <span class='bd-fr-i'>ne</span>."}}]],"grammar":[{"fr":"Elle va permettre à la Chine","en":"<b>aller + plain verb = the near future.</b> Only <span class='fr'>aller</span> changes with the subject; the second verb stays plain."},{"fr":"Meta a annulé l'achat","en":"<b>avoir + past participle = the past (passé composé).</b> <span class='fr'>a</span> changes with the subject; the main verb takes its past form."},{"fr":"Personne ne sait","en":"<b>“personne ne” is a negative word-pair,</b> like <span class='fr'>ne … pas</span> but meaning “nobody” instead of “not.”"}],"quiz":{"q":"Pourquoi Meta a-t-il annulé l'achat de Manus ?","a":"Parce que la Chine n'est pas d'accord. (Because China does not agree.)"},"flag":"I compressed the legal detail a lot: the real story involves China's 2021 anti-sanctions law, a Singaporean shipping firm also caught up in a separate case, and the technical idea of “secondary sanctions” — I left all of that out to keep the story concrete. <span class='fr'>empêcher des gens de quitter le pays</span> is a plain-language stand-in for the technical term “entry and exit bans”; a French legal article would more likely say <b>interdiction de sortie du territoire</b>."},{"id":"iran-sanctions","chip":"Nouvelles sanctions contre l'Iran","kicker":"États-Unis · Iran · Économie","title":"14. Les États-Unis lancent de nouvelles sanctions contre l'Iran","level":"A1","gist":"The US launched new sanctions against Iran on August 24, targeting nearly 60 people, companies and ships, plus five sectors of its economy. Trump and his treasury secretary call it a historic economic attack, but the US hasn't used its most powerful weapon — sanctions on China, Iran's biggest oil buyer — because that could shake the world's financial system. The regime is unlikely to fall, and ordinary Iranians suffer more than the leaders. Some think the real goal is domestic: to move the Iran war off the front pages before the November elections.","body":[[{"fr":"{{Le 24 août|on August 24}}, les États-Unis {{lancent|launch}} de nouvelles sanctions contre l'Iran.","bd":{"meaning":"On August 24, the US launches new sanctions against Iran.","chunks":[["Le 24 août","on August 24"],["les États-Unis lancent","the US launches"],["de nouvelles sanctions","new sanctions"],["contre l'Iran","against Iran"]],"key":"<b>le + date = “on” a date.</b> French doesn't need a separate word for “on” before a date."}},{"fr":"{{Presque|almost}} soixante personnes et entreprises sont sur la liste.","bd":{"meaning":"Almost sixty people and companies are on the list.","chunks":[["Presque soixante","almost sixty"],["personnes et entreprises","people and companies"],["sont sur la liste","are on the list"]],"key":"<b>“sont” = “are.”</b> The plural (ils/elles) form of <span class='bd-fr-i'>être</span>."}},{"fr":"Le président Trump {{appelle ça|calls it}} « {{la plus grande|the biggest}} attaque économique de l'histoire ».","bd":{"meaning":"President Trump calls it \"the biggest economic attack in history.\"","chunks":[["Le président Trump appelle ça","President Trump calls this"],["la plus grande attaque économique","the biggest economic attack"],["de l'histoire","in history"]],"key":"<b>le/la plus + adjective = “the most ___.”</b> <span class='bd-fr-i'>la plus grande</span> = “the biggest.”"}}],[{"fr":"Mais les États-Unis {{gardent|keep}} leur arme la plus puissante {{dans le tiroir|in the drawer, unused}}.","bd":{"meaning":"But the US keeps its most powerful weapon in the drawer, unused.","chunks":[["Mais","but"],["les États-Unis gardent","the US keeps"],["leur arme la plus puissante","their most powerful weapon"],["dans le tiroir","in the drawer"]],"key":"<b>“leur” = their</b> (one thing owned by a plural group) — reuses the superlative <span class='bd-fr-i'>la plus puissante</span> from before."}},{"fr":"Cette arme, {{ce sont|these are}} des sanctions contre la Chine.","bd":{"meaning":"This weapon is sanctions against China.","chunks":[["Cette arme","this weapon"],["ce sont","these are"],["des sanctions contre la Chine","sanctions against China"]],"key":"<b>“ce sont” is the plural of “c'est.”</b> Use it when what follows is plural: <span class='bd-fr-i'>ce sont des sanctions</span> = “these are sanctions.”"}},{"fr":"La Chine {{achète|buys}} presque tout le pétrole iranien.","bd":{"meaning":"China buys almost all Iranian oil.","chunks":[["La Chine achète","China buys"],["presque tout le pétrole iranien","almost all Iranian oil"]],"key":"No new pattern here — just useful vocabulary for the story."}},{"fr":"Si les États-Unis {{punissent|punish}} la Chine, le système financier mondial {{peut exploser|could blow up}}.","bd":{"meaning":"If the US punishes China, the global financial system could blow up.","chunks":[["Si les États-Unis punissent la Chine","if the US punishes China"],["le système financier mondial","the global financial system"],["peut exploser","could blow up"]],"key":"<b>pouvoir + plain verb = “can/c
