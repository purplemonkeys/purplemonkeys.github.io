<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<!-- ================================================================
     EN CLAIR 中文 — a reader for original Chinese news and official notices.
     THIS IS THE SHELL (template): all CSS + logic. Article data is injected
     by the build at the ARTICLES data sentinel near the top of the script.
     It must appear exactly once; never paste article data into this file.

     Sources per article (articles-zh/):
       NN-id.txt        original text, made by tools/zh_prepare.py from Jack's
                        file. Claude never types or edits article text.
       NN-id.auto.json  generated words / pinyin / dictionary glosses
       NN-id.notes.json Claude's annotations: word fixes (py, en, casual, hard),
                        breakdowns, register notes, quiz, flag, source
     The build merges them into one record per article:
       { id, num, chip, kicker, kind, register, gist, source, flag, quiz,
         register_notes, title:{text,tok}, paras:[[{n,tok,bd}]] }
     tok = [word, pinyin, english, casual, hard(0/1)]; pinyin "" = punctuation.

     ES5 ONLY (same rule as En Clair): var/function, XMLHttpRequest, no
     arrow functions, template literals, let/const, Set/Map, spread.
     ================================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F6F3EF; --card:#FCFAF8; --ink:#2A2523; --muted:#76706C; --faint:#A39C97;
    --rule:#E7E1DA; --accent:#B42B23; --accent-deep:#861F19;
    --hl:rgba(244,201,93,.42); --hl-strong:rgba(240,186,58,.6); --gloss:#861F19;
    --maxw:680px;
    --font-read:'Songti SC','STSong','Noto Serif SC','Noto Serif CJK SC','Source Han Serif SC','SimSun',Georgia,serif;
    --font-en:'Spectral',Georgia,'Times New Roman',serif;
    --font-ui:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Noto Sans CJK SC','Microsoft YaHei','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-display:'Fraunces','Songti SC','Noto Serif SC',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;line-height:1.5}
  body.sheet-open .wrap{padding-bottom:190px}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:20px 18px 72px}

  .masthead{position:relative;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 52px 14px 0;border-bottom:1px solid var(--rule)}
  .brand{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:-.01em;line-height:1;cursor:pointer}
  .brand .clair{color:var(--accent)}
  .brand .zh{color:var(--accent);font-family:var(--font-read);font-weight:700;letter-spacing:.02em}
  .tagline{font-size:13px;color:var(--muted);font-family:var(--font-read)}
  .lang-switch{position:absolute;right:0;top:-3px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:13px;letter-spacing:.03em;text-decoration:none;box-shadow:0 2px 6px rgba(134,31,25,.25);transition:background .15s,transform .12s}
  .lang-switch:hover{background:var(--accent-deep);transform:translateY(-1px)}
  .lang-switch:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

  .view{display:none}
  .view.active{display:block}

  .index-intro{font-size:13px;color:var(--muted);letter-spacing:.02em;margin:18px 2px 12px}
  .index-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 4px}
  .index-head .index-intro{margin:0}
  .memtoggle{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--card);flex:0 0 auto}
  .mem-opt{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted);background:transparent;border:none;padding:6px 14px;cursor:pointer}
  .mem-opt+.mem-opt{border-left:1px solid var(--rule)}
  .mem-opt[aria-pressed="true"]{background:var(--accent);color:#fff}
  .mem-hint{font-size:11.5px;color:var(--faint);margin:0 2px 12px}
  .cards{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:560px){ .cards{grid-template-columns:1fr 1fr} }
  .empty{font-size:13.5px;color:var(--muted);padding:6px 2px}

  .card{position:relative;background:var(--card);border:1px solid var(--rule);border-radius:14px;transition:border-color .15s,transform .12s,box-shadow .15s,opacity .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 18px rgba(180,43,35,.09)}
  .card-open{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;font-family:var(--font-ui);color:var(--ink);padding:16px 46px 14px 16px;border-radius:14px}
  .card-open:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card .k{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--faint)}
  .card .ttl{font-family:var(--font-read);font-weight:700;font-size:19px;line-height:1.35;color:var(--ink)}
  .card .meta{display:flex;align-items:center;gap:8px;margin-top:2px}
  .card .lvl{font-size:11px;font-weight:600;color:var(--accent-deep);border:1px solid var(--accent);border-radius:999px;padding:2px 8px;background:rgba(180,43,35,.06)}
  .card .tag{font-size:12px;color:var(--muted);font-family:var(--font-read)}
  .card .go{font-size:12.5px;font-weight:600;color:var(--accent)}
  .card-mark{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:1.6px solid var(--rule);background:var(--paper);cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px;line-height:1;z-index:2;transition:border-color .15s,background .15s,color .15s}
  .card-mark:hover{border-color:var(--accent);color:var(--faint)}
  .card.read{opacity:.58}
  .card.read:hover{opacity:.9}
  .card.read .card-mark{background:var(--accent);border-color:var(--accent);color:#fff}

  .read-section{margin-top:22px;border-top:1px solid var(--rule)}
  .read-section summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:12px 2px 10px;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
  .read-section summary::-webkit-details-marker{display:none}
  .read-section .chev{transition:transform .2s;color:var(--accent);font-size:11px}
  .read-section[open] .chev{transform:rotate(90deg)}

  .back{display:inline-flex;align-items:center;gap:6px;background:transparent;border:none;cursor:pointer;color:var(--accent-deep);font-family:var(--font-ui);font-size:13px;font-weight:600;padding:16px 2px 6px;margin-left:-2px}
  .back:hover{color:var(--accent)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 2px}
  .btn{font-family:var(--font-ui);font-size:12.5px;font-weight:500;color:var(--accent-deep);background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer;transition:background .15s,border-color .15s}
  .btn:hover{border-color:var(--accent)}
  .btn[aria-pressed="true"]{background:rgba(180,43,35,.1);border-color:var(--accent)}
  .btn.done[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg{display:inline-flex;align-items:center;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--card)}
  .seg-label{font-size:11.5px;font-weight:600;color:var(--faint);padding:0 8px 0 10px}
  .seg-opt{font-family:var(--font-ui);font-size:12.5px;color:var(--accent-deep);background:transparent;border:none;border-left:1px solid var(--rule);padding:7px 11px;cursor:pointer}
  .seg-opt[aria-pressed="true"]{background:var(--accent);color:#fff}
  .legend{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 0 0}
  .legend .mk{color:var(--accent);font-weight:700}
  .legend .hw{border-bottom:1.5px dotted rgba(180,43,35,.55)}

  article{margin-top:14px}
  .kicker{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--faint);margin-bottom:6px}
  .title-row{display:flex;align-items:flex-start;gap:12px}
  .title{font-family:var(--font-read);font-weight:700;font-size:25px;line-height:1.7;margin:0 0 4px;flex:1}
  .story-lvl{flex:0 0 auto;margin-top:10px;font-size:11px;font-weight:600;color:var(--accent-deep);border:1px solid var(--accent);border-radius:999px;padding:3px 9px;background:rgba(180,43,35,.06);white-space:nowrap}
  .gist{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;margin:14px 0 6px;font-family:var(--font-en);font-size:15px;line-height:1.55;color:#4a4340}
  .gist .gist-label{font-family:var(--font-ui);font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
  .gist.hidden{display:none}

  .body{font-family:var(--font-read);font-size:20px;line-height:2.35;margin-top:18px}
  .body .para{margin:0 0 .9em}
  .body .para.sub{font-weight:700;font-size:.92em;color:var(--accent-deep);margin:1.5em 0 .3em;border-top:1px solid var(--rule);padding-top:.5em}
  .lat{font-family:var(--font-en);font-size:.92em}
  .sentence{border-radius:3px;transition:background .12s}
  .sentence.active{background:rgba(180,43,35,.06)}

  /* words + pinyin (ruby). Modes live on the article element. */
  .wb{display:inline-block}  /* one word = one unbreakable box; lines break between words */
  ruby.w{cursor:pointer;border-radius:3px;padding:0 1px;transition:background .12s}  ruby.w:hover{background:rgba(180,43,35,.07)}
  ruby.w.on{background:var(--hl-strong)}
  ruby.w.hard{border-bottom:1.5px dotted rgba(180,43,35,.45)}
  ruby.w:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  rt{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:.48em;font-weight:400;color:var(--accent-deep);letter-spacing:0;line-height:1}
  .py-off rt{display:none}
  .py-hard ruby.w:not(.hard) rt{display:none}

  .bd-mark{display:inline-block;vertical-align:.12em;margin:0 .15em 0 .1em;width:1.15em;height:1.15em;line-height:1.1em;border-radius:50%;border:1.4px solid var(--accent);background:transparent;color:var(--accent);font-size:.62em;font-weight:700;text-align:center;padding:0;cursor:pointer;font-family:var(--font-ui);transition:transform .15s,background .15s,color .15s}
  .bd-mark.open{background:var(--accent);color:#fff;transform:rotate(90deg)}
  .bd-mark:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

  .breakdown{display:none;margin:4px 0 12px;padding:13px 15px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px;font-family:var(--font-ui);line-height:1.5}
  .breakdown.open{display:block;animation:bd .22s ease}
  @keyframes bd{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .bd-meaning{font-family:var(--font-en);font-size:16px;font-weight:500;color:var(--ink);margin-bottom:11px}
  .bd-chunks{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
  .bd-row{display:flex;gap:12px;align-items:baseline;font-size:13.5px;line-height:1.5}
  .bd-zh{font-family:var(--font-read);font-size:15px;color:var(--accent-deep);flex:0 0 44%;min-width:0}
  .bd-en{color:#4a4340;flex:1;min-width:0}
  .bd-key{font-size:12.5px;line-height:1.6;color:#4a4340;border-top:1px solid var(--rule);padding-top:9px}
  .bd-key-label{display:block;font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
  .bd-zh-i{font-family:var(--font-read);font-size:1.12em;color:var(--ink)}

  .section{margin-top:26px;border-top:1px solid var(--rule);padding-top:8px}
  summary{list-style:none}
  .section summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
  .section summary::-webkit-details-marker{display:none}
  .section summary .chev{transition:transform .2s;color:var(--accent);font-size:12px}
  .section details[open] summary .chev{transform:rotate(90deg)}
  .reg-row{display:flex;align-items:baseline;gap:10px;padding:7px 2px;border-bottom:1px solid var(--rule);font-size:13.5px}
  .reg-f{font-family:var(--font-read);font-size:17px;color:var(--accent-deep);flex:0 0 34%}
  .reg-arrow{color:var(--faint)}
  .reg-c{font-family:var(--font-read);font-size:17px;color:var(--ink);flex:0 0 30%}
  .reg-en{color:var(--muted);flex:1}
  .quiz{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px}
  .quiz .q{font-family:var(--font-read);font-size:18px;color:var(--ink);margin:0 0 10px}
  .quiz .answer{font-family:var(--font-read);font-size:16px;color:#4a4340;margin:8px 0 0;display:none}
  .quiz .answer.show{display:block}
  .reveal-btn{font-family:var(--font-ui);font-size:12.5px;font-weight:500;color:var(--accent-deep);background:transparent;border:1px solid var(--accent);border-radius:8px;padding:6px 12px;cursor:pointer}
  .flag{margin-top:22px;font-size:12px;line-height:1.55;color:var(--muted);background:rgba(240,186,58,.12);border-radius:8px;padding:10px 12px}
  .flag b{color:var(--accent-deep);font-weight:600}
  .source{margin-top:14px;font-size:12px;line-height:1.5;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}
  .source a{color:var(--accent-deep)}
  .foot{margin-top:28px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5}

  /* word card: fixed to the bottom of the screen */
  .sheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:var(--maxw);margin:0 auto;background:var(--card);border:1px solid var(--rule);border-bottom:none;border-top:3px solid var(--accent);border-radius:14px 14px 0 0;box-shadow:0 -6px 24px rgba(42,37,35,.12);padding:14px 52px 18px 18px}
  .sheet.open{display:block;animation:sh .18s ease}
  @keyframes sh{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
  .sheet-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .sheet-zh{font-family:var(--font-read);font-size:30px;font-weight:700;color:var(--ink);line-height:1.2}
  .sheet-py{font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:17px;color:var(--accent-deep)}
  .sheet-en{font-family:var(--font-en);font-size:16px;color:#4a4340;margin-top:6px;line-height:1.45}
  .sheet-casual{margin-top:8px;font-size:13px;color:var(--muted)}
  .sheet-casual b{font-family:var(--font-read);font-size:17px;color:var(--ink);font-weight:700;margin-left:4px}
  .sheet-x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--muted);font-size:18px;line-height:1;cursor:pointer}

  @media (max-width:480px){
    .brand{font-size:26px}.body{font-size:19px;line-height:2.3}.title{font-size:22px}
    .bd-row{flex-direction:column;gap:1px}.bd-zh{flex-basis:auto}
    .reg-f,.reg-c{flex-basis:auto}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<title>En Clair 中文</title>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="brand" id="brand" role="button" tabindex="0" title="回到首页">En&nbsp;<span class="clair">clair</span> <span class="zh">中文</span></div>
    <div class="tagline">读懂正式中文 · 拼音与释义</div>
    <a class="lang-switch" href="index.html" title="En Clair — français" aria-label="Switch to En Clair, French">FR</a>
  </header>

  <!-- INDEX VIEW -->
  <main id="view-index" class="view">
    <div class="index-head">
      <p class="index-intro">选择一篇文章：</p>
      <div class="memtoggle" id="memToggle" role="group" aria-label="Memory">
        <button class="mem-opt" data-mem="M1" type="button">M1</button>
        <button class="mem-opt" data-mem="M2" type="button">M2</button>
      </div>
    </div>
    <p class="mem-hint" id="memHint"></p>
    <div class="cards" id="cards"></div>
    <details class="read-section" id="readSection">
      <summary><span class="chev">▶</span>已读 (<span id="readCount">0</span>)</summary>
      <div class="cards" id="readCards"></div>
    </details>
  </main>

  <!-- STORY VIEW -->
  <main id="view-story" class="view">
    <button class="back" id="backBtn">← 全部文章</button>
    <div class="toolbar">
      <button class="btn" id="toggleGist" aria-pressed="true" title="Show / hide the English summary">摘要</button>
      <div class="seg" id="pySeg" role="group" aria-label="Pinyin">
        <span class="seg-label">拼音</span>
        <button class="seg-opt" data-py="off" type="button" title="Pinyin off">关</button>
        <button class="seg-opt" data-py="hard" type="button" title="Pinyin on formal / hard words only">难词</button>
        <button class="seg-opt" data-py="all" type="button" title="Pinyin on every word">全部</button>
      </div>
      <button class="btn done" id="toggleRead" aria-pressed="false" title="Mark this article read / unread">标为已读</button>
    </div>
    <p class="legend">Tap any word for its pinyin and meaning. Tap <span class="mk">▸</span> after a sentence for a breakdown. <span class="hw">Dotted</span> words are formal or hard.</p>
    <article id="article"></article>
  </main>

  <div class="foot">En clair 中文 · 简体 · 拼音 + 释义</div>
</div>

<div class="sheet" id="wordSheet" role="dialog" aria-label="Word" aria-live="polite">
  <button class="sheet-x" id="sheetX" type="button" aria-label="Close">×</button>
  <div class="sheet-top"><span class="sheet-zh" id="sheetZh"></span><span class="sheet-py" id="sheetPy"></span></div>
  <div class="sheet-en" id="sheetEn"></div>
  <div class="sheet-casual" id="sheetCasual"></div>
</div>

<script>
/* ---- visible error log (no dev console on some devices) ---- */
window.onerror = function (msg, url, line) {
  try {
    var dbg = document.getElementById('debugBox');
    if (!dbg) {
      dbg = document.createElement('div');
      dbg.id = 'debugBox';
      dbg.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#fee;color:#900;font:11px monospace;padding:8px;z-index:9999;max-height:35%;overflow:auto;white-space:pre-wrap;border-bottom:2px solid #900';
      document.body.appendChild(dbg);
    }
    dbg.textContent += 'ERROR: ' + msg + ' (line ' + line + ')\n';
  } catch (e) {}
  return false;
};

/* ---- tap helper (same as En Clair): touchend for old touch browsers,
        ignore drags, swallow the delayed synthetic click ---- */
function addTap(el, handler) {
  var lastTouch = 0, startX = 0, startY = 0, moved = false;
  el.addEventListener('touchstart', function (e) {
    moved = false;
    if (e.touches && e.touches.length) { startX = e.touches[0].clientX; startY = e.touches[0].clientY; }
  }, { passive: true });
  el.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length) {
      var dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
      if (Math.sqrt(dx * dx + dy * dy) > 12) moved = true;
    }
  }, { passive: true });
  el.addEventListener('touchend', function (e) {
    lastTouch = Date.now();
    if (moved) return;
    e.preventDefault();
    handler(e);
  }, { passive: false });
  el.addEventListener('click', function (e) {
    if (Date.now() - lastTouch < 600) return;
    handler(e);
  });
}
function onKey(el, fn) {
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); fn(e); }
  });
}

var ARTICLES = /*ARTICLES_DATA_SENTINEL*/[];

/* ---- storage keys: separate from the French reader ---- */
var READ_KEY = 'enclairzh:read:v1';
var MEM_KEY = 'enclairzh:mem:v1';
var PY_KEY = 'enclairzh:py:v1';
var M1_URL = 'progress/m1-zh.json';

var readSet = {}, m1Set = {}, m1Loaded = false, m1Failed = false;
var mem = 'M2';
var pyMode = 'hard';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

(function loadPrefs() {
  var v = lsGet(MEM_KEY);
  if (v === 'M1' || v === 'M2') mem = v;
  var p = lsGet(PY_KEY);
  if (p === 'off' || p === 'hard' || p === 'all') pyMode = p;
  var raw = lsGet(READ_KEY);
  if (raw) {
    try {
      var arr = JSON.parse(raw);
      for (var i = 0; i < arr.length; i++) readSet[arr[i]] = true;
    } catch (e) {}
  }
})();
function saveRead() {
  var arr = [];
  for (var k in readSet) { if (readSet.hasOwnProperty(k)) arr.push(k); }
  lsSet(READ_KEY, JSON.stringify(arr));
}
function loadM1(cb) {
  if (m1Loaded || m1Failed) { if (cb) cb(); return; }
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', M1_URL, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      var parsed = null;
      if ((xhr.status === 200 || xhr.status === 0) && xhr.responseText) {
        try { parsed = JSON.parse(xhr.responseText); } catch (e) { parsed = null; }
      }
      if (parsed) {
        var list = parsed.read ? parsed.read : (parsed.length ? parsed : []);
        m1Set = {};
        for (var i = 0; i < list.length; i++) m1Set[list[i]] = true;
        m1Loaded = true;
      } else { m1Failed = true; }
      if (cb) cb();
    };
    xhr.onerror = function () { m1Failed = true; if (cb) cb(); };
    xhr.send();
  } catch (e) { m1Failed = true; if (cb) cb(); }
}
function activeSet() { return mem === 'M1' ? m1Set : readSet; }
function isRead(id) { return !!activeSet()[id]; }
function setRead(id, val) {
  if (mem === 'M1') return; /* M1 is read-only */
  if (val) readSet[id] = true; else delete readSet[id];
  saveRead();
}

var $ = function (id) { return document.getElementById(id); };
var cardsEl = $('cards'), readCardsEl = $('readCards'), readSection = $('readSection'), readCount = $('readCount');
var memToggle = $('memToggle'), memHint = $('memHint');
var viewIndex = $('view-index'), viewStory = $('view-story'), article = $('article');
var toggleGistBtn = $('toggleGist'), toggleReadBtn = $('toggleRead'), pySeg = $('pySeg');
var sheet = $('wordSheet');
var gistShown = true, currentId = null, activeWord = null;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- word card ---------- */
function hideWord() {
  if (activeWord) activeWord.className = activeWord.className.replace(/\s?\bon\b/, '');
  activeWord = null;
  sheet.className = 'sheet';
  document.body.className = document.body.className.replace(/\s?\bsheet-open\b/, '');
}
function showWord(t, el) {
  if (activeWord === el) { hideWord(); return; }
  if (activeWord) activeWord.className = activeWord.className.replace(/\s?\bon\b/, '');
  activeWord = el;
  el.className += ' on';
  $('sheetZh').textContent = t[0];
  $('sheetPy').textContent = t[1];
  $('sheetEn').textContent = t[2] || '(no gloss yet)';
  $('sheetCasual').innerHTML = t[3] ? '口语 · everyday:<b>' + esc(t[3]) + '</b>' : '';
  sheet.className = 'sheet open';
  if (!/\bsheet-open\b/.test(document.body.className)) document.body.className += ' sheet-open';
}
addTap($('sheetX'), function () { hideWord(); });

/* ---------- rendering ---------- */
/* Each word sits in its own inline-block box (.wb), so lines break between
   words, never inside one. Closing punctuation joins the word before it and
   opening punctuation the word after it, so neither starts or ends a line on
   its own. Returns the last box, so the breakdown marker can be attached to it. */
var CLOSE_P = '，。；：、）》」』”’！？,.;:)%';
var OPEN_P = '（《「『“‘(';
function renderTokens(tok, container) {
  var last = null, pending = '';
  function newBox() {
    var b = document.createElement('span');
    b.className = 'wb';
    if (pending) { b.appendChild(document.createTextNode(pending)); pending = ''; }
    container.appendChild(b);
    last = b;
    return b;
  }
  for (var i = 0; i < tok.length; i++) {
    (function (t) {
      if (!t[1]) {
        var txt = t[0];
        if (last && CLOSE_P.indexOf(txt.charAt(0)) >= 0) { last.appendChild(document.createTextNode(txt)); return; }
        if (OPEN_P.indexOf(txt.charAt(txt.length - 1)) >= 0) { pending += txt; return; }
        /* numbers (40%, 2026) stick to the word before them: 可达40% never splits */
        if (/^[0-9.%]+$/.test(txt) && last && last.className === 'wb') {
          last.appendChild(document.createTextNode(pending + txt));
          pending = '';
          return;
        }
        /* Latin words, numbers, spaces: ordinary inline text, so "Donald Trump"
           keeps its space and wraps like normal English */
        if (!last || last.className !== 'lat') {
          var lat = document.createElement('span');
          lat.className = 'lat';
          container.appendChild(lat);
          last = lat;
        }
        last.appendChild(document.createTextNode(pending + txt));
        pending = '';
        return;
      }
      var r = document.createElement('ruby');
      r.className = 'w' + (t[4] ? ' hard' : '');
      r.setAttribute('tabindex', '0');
      r.setAttribute('role', 'button');
      r.setAttribute('aria-label', t[0] + ' ' + t[1] + (t[2] ? ', ' + t[2] : ''));
      r.appendChild(document.createTextNode(t[0]));
      var rt = document.createElement('rt');
      rt.textContent = t[1];
      r.appendChild(rt);
      addTap(r, function (e) { if (e && e.stopPropagation) e.stopPropagation(); showWord(t, r); });
      onKey(r, function () { showWord(t, r); });
      /* a one-character unit after a number (1月, 10日, 14个) joins the number's box */
      if (last && last.className === 'wb' && t[0].length === 1 && !pending && /[0-9]$/.test(last.lastChild && last.lastChild.nodeType === 3 ? last.lastChild.nodeValue : '')) {
        last.appendChild(r);
        return;
      }
      newBox().appendChild(r);
    })(tok[i]);
  }
  if (pending) newBox();
  return last;
}
function buildBreakdown(bd) {
  var box = document.createElement('div');
  box.className = 'breakdown';
  var html = '<div class="bd-meaning">' + bd.meaning + '</div>';
  if (bd.chunks && bd.chunks.length) {
    html += '<div class="bd-chunks">';
    for (var i = 0; i < bd.chunks.length; i++) {
      html += '<div class="bd-row"><span class="bd-zh">' + bd.chunks[i][0] + '</span><span class="bd-en">' + bd.chunks[i][1] + '</span></div>';
    }
    html += '</div>';
  }
  if (bd.key) html += '<div class="bd-key"><span class="bd-key-label">Key</span>' + bd.key + '</div>';
  box.innerHTML = html;
  return box;
}
function renderBody(paras) {
  var frag = document.createDocumentFragment();
  for (var p = 0; p < paras.length; p++) {
    var pe = document.createElement('div');
    pe.className = 'para';
    /* a one-sentence line with no full stop and short = a subheading */
    if (paras[p].length === 1) {
      var joined = '';
      for (var j = 0; j < paras[p][0].tok.length; j++) joined += paras[p][0].tok[j][0];
      if (joined.length <= 24 && !/[。！？]/.test(joined)) pe.className = 'para sub';
    }
    for (var s = 0; s < paras[p].length; s++) {
      (function (sent) {
        var se = document.createElement('span');
        se.className = 'sentence';
        pe.appendChild(se);
        var lastBox = renderTokens(sent.tok, se);
        if (sent.bd) {
          var mk = document.createElement('button');
          mk.className = 'bd-mark';
          mk.setAttribute('type', 'button');
          mk.setAttribute('aria-label', 'Breakdown of sentence ' + sent.n);
          mk.setAttribute('aria-expanded', 'false');
          mk.textContent = '▸';
          var box = buildBreakdown(sent.bd);
          var toggle = function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            var open = !/\bopen\b/.test(box.className);
            box.className = open ? 'breakdown open' : 'breakdown';
            mk.className = open ? 'bd-mark open' : 'bd-mark';
            se.className = open ? 'sentence active' : 'sentence';
            mk.setAttribute('aria-expanded', open ? 'true' : 'false');
          };
          addTap(mk, toggle);
          (lastBox || se).appendChild(mk); /* glued to the last word: never wraps alone */
          pe.appendChild(box);
        }
      })(paras[p][s]);
    }
    frag.appendChild(pe);
  }
  return frag;
}
function applyPy() {
  article.className = 'py-' + pyMode;
  var opts = pySeg.getElementsByTagName('button');
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed', opts[i].getAttribute('data-py') === pyMode ? 'true' : 'false');
  }
}
function addSection(title, open, fill) {
  var sec = document.createElement('div');
  sec.className = 'section';
  var det = document.createElement('details');
  det.open = open;
  det.innerHTML = "<summary><span class='chev'>▶</span>" + title + "</summary>";
  fill(det);
  sec.appendChild(det);
  article.appendChild(sec);
}
function buildArticle(a) {
  article.innerHTML = '';
  hideWord();
  var kicker = document.createElement('div');
  kicker.className = 'kicker';
  kicker.textContent = a.kicker || '';
  article.appendChild(kicker);

  var trow = document.createElement('div');
  trow.className = 'title-row';
  var h1 = document.createElement('h1');
  h1.className = 'title';
  h1.appendChild(document.createTextNode(a.num + '. '));
  renderTokens(a.title.tok, h1);
  var lvl = document.createElement('span');
  lvl.className = 'story-lvl';
  lvl.textContent = a.register || '';
  trow.appendChild(h1);
  trow.appendChild(lvl);
  article.appendChild(trow);

  var gist = document.createElement('div');
  gist.className = 'gist' + (gistShown ? '' : ' hidden');
  gist.id = 'gistBox';
  gist.innerHTML = "<span class='gist-label'>The gist, in English</span>" + a.gist;
  article.appendChild(gist);

  var body = document.createElement('div');
  body.className = 'body';
  body.appendChild(renderBody(a.paras));
  article.appendChild(body);

  if (a.register_notes && a.register_notes.length) {
    addSection('正式 → 口语 · Formal → everyday', true, function (det) {
      for (var i = 0; i < a.register_notes.length; i++) {
        var n = a.register_notes[i];
        var row = document.createElement('div');
        row.className = 'reg-row';
        row.innerHTML = "<span class='reg-f'>" + esc(n.formal) + "</span><span class='reg-arrow'>→</span><span class='reg-c'>" + esc(n.casual) + "</span><span class='reg-en'>" + esc(n.en) + "</span>";
        det.appendChild(row);
      }
    });
  }
  if (a.quiz) {
    addSection('小问题 · Quick question', false, function (det) {
      var quiz = document.createElement('div');
      quiz.className = 'quiz';
      quiz.innerHTML = "<p class='q'>" + a.quiz.q + "</p><button class='reveal-btn' type='button'>看答案</button><p class='answer'>" + a.quiz.a + "</p>";
      var btn = quiz.getElementsByTagName('button')[0], ans = quiz.getElementsByTagName('p')[1];
      addTap(btn, function () { ans.className = 'answer show'; btn.style.display = 'none'; });
      det.appendChild(quiz);
    });
  }
  if (a.flag) {
    var flag = document.createElement('div');
    flag.className = 'flag';
    flag.innerHTML = '<b>注意 · Note</b> · ' + a.flag;
    article.appendChild(flag);
  }
  if (a.source) {
    var src = document.createElement('div');
    src.className = 'source';
    /* always: source name + the article's headline; link and date only if given */
    var nm = esc(a.source.name);
    if (a.source.url) nm = '<a href="' + esc(a.source.url) + '" target="_blank" rel="noopener">' + nm + '</a>';
    src.innerHTML = '来源 · Source: ' + nm + ' ·《' + esc(a.title.text) + '》' + (a.source.date ? ' · ' + esc(a.source.date) : '');
    article.appendChild(src);
  }
  applyPy();
}

/* ---------- index ---------- */
function makeCard(a) {
  var read = isRead(a.id);
  var card = document.createElement('div');
  card.className = 'card' + (read ? ' read' : '');
  var open = document.createElement('button');
  open.className = 'card-open';
  open.innerHTML = "<span class='k'>" + esc(a.kicker || '') + "</span><span class='ttl'>" + esc(a.num + '. ' + a.title.text) + "</span><span class='meta'><span class='lvl'>" + esc(a.register || '') + "</span><span class='tag'>" + esc(a.chip || '') + "</span></span><span class='go'>" + (read ? '再读 →' : '阅读 →') + "</span>";
  addTap(open, function () { location.hash = '#/' + encodeURIComponent(a.id); showStory(a.id); });
  var mark = document.createElement('button');
  mark.className = 'card-mark';
  mark.textContent = '✓';
  mark.setAttribute('aria-label', read ? 'Mark unread' : 'Mark read');
  addTap(mark, function (e) { if (e && e.stopPropagation) e.stopPropagation(); setRead(a.id, !isRead(a.id)); renderCards(); });
  card.appendChild(open);
  card.appendChild(mark);
  return card;
}
function renderCards() {
  cardsEl.innerHTML = '';
  readCardsEl.innerHTML = '';
  var nRead = 0, nUnread = 0;
  for (var i = 0; i < ARTICLES.length; i++) {
    if (isRead(ARTICLES[i].id)) { readCardsEl.appendChild(makeCard(ARTICLES[i])); nRead++; }
    else { cardsEl.appendChild(makeCard(ARTICLES[i])); nUnread++; }
  }
  if (!nUnread) {
    var e = document.createElement('p');
    e.className = 'empty';
    e.textContent = '全部读完了 🎉';
    cardsEl.appendChild(e);
  }
  readCount.textContent = nRead;
  readSection.style.display = nRead ? 'block' : 'none';
}

/* ---------- routing ---------- */
function syncReadBtn() {
  var r = currentId && isRead(currentId);
  toggleReadBtn.setAttribute('aria-pressed', r ? 'true' : 'false');
  toggleReadBtn.textContent = r ? '已读 ✓' : '标为已读';
}
function showIndex() {
  currentId = null;
  hideWord();
  renderCards();
  viewStory.className = 'view';
  viewIndex.className = 'view active';
  window.scrollTo(0, 0);
}
function showStory(id) {
  var a = null;
  for (var i = 0; i < ARTICLES.length; i++) { if (ARTICLES[i].id === id) { a = ARTICLES[i]; break; } }
  if (!a) { showIndex(); return; }
  currentId = id;
  gistShown = true;
  toggleGistBtn.setAttribute('aria-pressed', 'true');
  buildArticle(a);
  syncReadBtn();
  viewIndex.className = 'view';
  viewStory.className = 'view active';
  window.scrollTo(0, 0);
}
function route() {
  var m = location.hash.match(/^#\/(.+)$/);
  if (m) showStory(decodeURIComponent(m[1])); else showIndex();
}
window.addEventListener('hashchange', route);
addTap($('backBtn'), function () { location.hash = '#/'; showIndex(); });
addTap($('brand'), function () { location.hash = '#/'; showIndex(); });
onKey($('brand'), function () { location.hash = '#/'; });
addTap(toggleGistBtn, function () {
  gistShown = !gistShown;
  toggleGistBtn.setAttribute('aria-pressed', gistShown ? 'true' : 'false');
  var b = $('gistBox');
  if (b) b.className = gistShown ? 'gist' : 'gist hidden';
});
addTap(toggleReadBtn, function () {
  if (!currentId) return;
  setRead(currentId, !isRead(currentId));
  syncReadBtn();
});
(function wirePy() {
  var opts = pySeg.getElementsByTagName('button');
  for (var i = 0; i < opts.length; i++) {
    (function (btn) {
      addTap(btn, function () { pyMode = btn.getAttribute('data-py'); lsSet(PY_KEY, pyMode); applyPy(); });
    })(opts[i]);
  }
})();
function renderMem() {
  var opts = memToggle.getElementsByTagName('button');
  for (var i = 0; i < opts.length; i++) {
    opts[i].setAttribute('aria-pressed', opts[i].getAttribute('data-mem') === mem ? 'true' : 'false');
  }
  if (mem === 'M1') {
    memHint.textContent = m1Failed ? 'M1 · 共享记录（仅在线可用，本地文件不可用）' : 'M1 · 共享记录，只读';
  } else {
    memHint.textContent = 'M2 · 本设备的记录';
  }
}
function setMem(v) {
  if (v !== 'M1' && v !== 'M2') return;
  mem = v;
  lsSet(MEM_KEY, mem);
  renderMem();
  if (mem === 'M1' && !m1Loaded && !m1Failed) {
    loadM1(function () { renderMem(); renderCards(); if (currentId) syncReadBtn(); });
  } else { renderCards(); if (currentId) syncReadBtn(); }
}
(function wireMem() {
  var opts = memToggle.getElementsByTagName('button');
  for (var i = 0; i < opts.length; i++) {
    (function (btn) { addTap(btn, function () { setMem(btn.getAttribute('data-mem')); }); })(opts[i]);
  }
})();

renderMem();
if (mem === 'M1') { loadM1(function () { renderMem(); renderCards(); route(); }); }
else { renderCards(); route(); }
</script>
</body>
</html>
